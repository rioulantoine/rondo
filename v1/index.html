<script>
/* ---------- filet de sécurité global : affiche l'erreur exacte au lieu d'un écran vide muet ---------- */
window.addEventListener('error', function(ev){ showFatalAppError(ev.error || ev.message); });
window.addEventListener('unhandledrejection', function(ev){ showFatalAppError(ev.reason); });
function showFatalAppError(err){
  const root = document.getElementById('root');
  if(!root || root.dataset.fatalErrorShown) return;
  root.dataset.fatalErrorShown = '1';
  root.innerHTML = `
    <div style="max-width:480px;margin:24px auto;padding:24px;background:#fff;border:1px solid #ddd;border-radius:16px;font-family:sans-serif;">
      <h2 style="margin-top:0;color:#B23B3B;">Erreur d'affichage</h2>
      <p style="font-size:13px;">Détail technique (à transmettre si le problème persiste) :</p>
      <pre style="white-space:pre-wrap;font-size:11px;background:var(--sand);padding:10px;border-radius:8px;overflow-x:auto;">${String((err && err.stack) || err || 'Erreur inconnue').replace(/</g,'&lt;')}</pre>
      <button onclick="location.reload()" style="margin-top:14px;width:100%;background:var(--sea-deep);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;">Réessayer</button>
    </div>`;
}
</script>

<script>
// firebaseConfig/db/FS_COLLECTION/encodeKey/getData/setData/setRestaurantRecord/escapeHtml/slugify/
// isValidEmail/slugToAuthEmail/waitForAuthReady/clearEstablishmentSession/getEstablishmentSession/
// persistEstablishmentSession/initOfflineBanner/logAppError + écouteurs d'erreur globaux viennent de shared.js
function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* ---------- impression, avec contournement d'une limite connue d'iOS ----------
   Quand l'appli est utilisée "ajoutée à l'écran d'accueil" (mode standalone), Safari bloque
   totalement window.print() — ce n'est pas un bug de l'appli, c'est une restriction d'Apple sur ce
   mode. Dans ce cas, on guide vers l'ouverture dans Safari plutôt que de laisser un bouton muet. */
/* ---------- génération de PDF téléchargeable (même méthode que le Rapport HACCP existant) ----------
   Contrairement à window.print(), totalement bloqué sur iOS quand l'appli est ajoutée à l'écran
   d'accueil, un vrai fichier PDF généré avec jsPDF se télécharge/partage normalement dans tous les
   cas — c'est la méthode à privilégier partout dans l'appli plutôt que window.print(). */
function buildSimplePdf(title, subtitle, sections, filename, orientation){
  if(!window.jspdf){ toast('Bibliothèque PDF non chargée — vérifie ta connexion et réessaie.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4', orientation: orientation||'portrait'});
  const margin = 14;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  let y = margin;
  doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(...THEME_RGB.primary);
  doc.text(title, margin, y); y += 6;
  if(subtitle){
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...THEME_RGB.inkSoft);
    doc.text(subtitle, margin, y); y += 9;
  } else { y += 4; }
  sections.forEach(sec=>{
    if(y > pageH - 35){ doc.addPage(); y = margin; }
    if(sec.heading){
      doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(...THEME_RGB.primary);
      doc.text(sec.heading, margin, y); y += 5.5;
    }
    if(sec.text){
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...THEME_RGB.ink);
      const lines = doc.splitTextToSize(sec.text, pageW - margin*2);
      doc.text(lines, margin, y); y += lines.length*4.6 + 4;
    }
    if(sec.columns){
      if(sec.rows && sec.rows.length){
        doc.autoTable({
          startY: y, margin:{left:margin, right:margin},
          head:[sec.columns], body: sec.rows,
          styles:{fontSize:8, cellPadding:2}, headStyles:{fillColor:THEME_RGB.primary, textColor:255, fontStyle:'bold'},
          alternateRowStyles:{fillColor:THEME_RGB.bg},
        });
        y = doc.lastAutoTable.finalY + 8;
      } else {
        doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...THEME_RGB.inkSoft);
        doc.text(sec.emptyText || 'Aucune donnée.', margin, y); y += 9;
      }
    }
  });
  doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(150,150,150);
  doc.text(`Document généré le ${new Date().toLocaleDateString('fr-FR')} via Check ton resto`, margin, pageH-8);
  doc.save(filename);
}
// comparaison robuste de noms : deux accents visuellement identiques (ex. "ï") peuvent être encodés
// différemment en interne selon l'appareil/le clavier utilisé pour les taper — normalize('NFC')
// ramène les deux formes à une représentation unique avant de comparer.
function sameName(a, b){ return (a||'').normalize('NFC').trim() === (b||'').normalize('NFC').trim(); }
function findTeamMember(team, name){ return (team||[]).find(m=>sameName(m.name, name)); }
const state = {};

function escapeAttr(s){ return escapeHtml(s); }
const PERM_LABELS = {cuisine:'Cuisine', salle:'Salle', bar:'Bar', reservation:'Réservation', planning:'Planning', incidents:'Signaler un renvoi/incident', absences:'Enregistrer une absence justifiée', validateSwaps:'Valider les échanges de shift'};
const POSTE_LABELS = {cuisine:'Cuisine', salle:'Salle', bar:'Bar', ouvfer:'Ouverture/Fermeture + Caisse'};
const PERM_CARDS = {
  cuisine:{href:'check-ta-cuisine.html', letter:'C', title:'Check ta cuisine', sub:'Températures, tâches, traçabilité, photos'},
  salle:{href:'check-ta-salle.html', letter:'S', title:'Check ta salle', sub:'Buffet, dressage, allergènes, nettoyage'},
  bar:{href:'check-ton-bar.html', letter:'B', title:'Check ton bar', sub:'Froids, tireuse, garnitures'},
  planning:{href:'planning.html', letter:'P', title:"Planning d'équipe", sub:'Horaires, export Google Agenda'},
  reservation:{href:'reservation.html', letter:'R', title:'Réservations', sub:'Plan de salle, espace pro'},
};

function normalizeMember(m){
  if(!m.permissions){
    if(m.zone==='cuisine') m.permissions=['cuisine'];
    else if(m.zone==='salle_bar') m.permissions=['salle','bar','reservation'];
    else m.permissions=[];
  }
  if(!m.postes){
    m.postes = m.permissions.filter(p=>['cuisine','salle','bar'].includes(p));
  }
  return m;
}

/* ===================== pointage (badgeuse) ===================== */
function pad2(n){ return String(n).padStart(2,'0'); }
function monthKeyOf(dateObj){ return dateObj.getFullYear()+'-'+pad2(dateObj.getMonth()+1); }
async function loadPointageMonth(mk){ return await getData(`log:${RESTAURANT_ID}:pointage:${mk}`, true, []); }
async function savePointageMonth(mk, arr){ return await setData(`log:${RESTAURANT_ID}:pointage:${mk}`, arr, true); }
async function loadPointageSettings(){
  return (await getData(`config:${RESTAURANT_ID}:pointageSettings`, true, null)) || {pauseEnabled: false};
}
async function savePointageSettings(s){ return await setData(`config:${RESTAURANT_ID}:pointageSettings`, s, true); }
async function determinePauseType(member){
  const mk = monthKeyOf(new Date());
  const events = await loadPointageMonth(mk);
  const today = todayISOHome();
  const todays = events.filter(e=> e.memberId===member.id && e.ts.slice(0,10)===today && (e.type==='pause_debut'||e.type==='pause_fin'));
  todays.sort((a,b)=> a.ts.localeCompare(b.ts));
  const last = todays[todays.length-1];
  return (last && last.type==='pause_debut') ? 'pause_fin' : 'pause_debut';
}
function pausePairs(events){
  const sorted = events.filter(e=> e.type==='pause_debut'||e.type==='pause_fin').slice().sort((a,b)=> a.ts.localeCompare(b.ts));
  const pairs = [];
  let openDebut = null;
  sorted.forEach(e=>{
    if(e.type==='pause_debut'){ if(openDebut) pairs.push({debut:openDebut, fin:null}); openDebut = e.ts; }
    else if(e.type==='pause_fin'){ if(openDebut){ pairs.push({debut:openDebut, fin:e.ts}); openDebut=null; } }
  });
  if(openDebut) pairs.push({debut:openDebut, fin:null});
  return pairs;
}
async function findPlannedStart(memberName, dateIso){
  const mk = dateIso.slice(0,7);
  const shifts = await getData(`log:${RESTAURANT_ID}:planning:${mk}`, true, []);
  const todays = shifts.filter(s=> s.staff===memberName && s.date===dateIso && s.start);
  if(!todays.length) return null;
  todays.sort((a,b)=> a.start.localeCompare(b.start));
  return todays[0].start;
}
const SHIFT_TOLERANCE_MIN = 5; // marge de tolérance avant/après un créneau planifié, avant de demander une justification

/* ---------- position GPS au badgeage (enregistrement seul, ne bloque jamais) ----------
   Sert uniquement à donner un repère au/à la responsable en cas de doute — jamais à suivre les
   déplacements des employés en continu, ni à empêcher un pointage. Si la position n'est pas
   disponible (refusée, GPS lent, appareil sans GPS), le badgeage se fait normalement, sans position. */
const GEO_TIMEOUT_MS = 3500;
function captureGeolocation(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    let done = false;
    const finish = (val)=>{ if(!done){ done = true; resolve(val); } };
    setTimeout(()=> finish(null), GEO_TIMEOUT_MS);
    try{
      navigator.geolocation.getCurrentPosition(
        pos => finish({lat: pos.coords.latitude, lng: pos.coords.longitude}),
        () => finish(null),
        {enableHighAccuracy:true, timeout:GEO_TIMEOUT_MS, maximumAge:120000}
      );
    }catch(e){ finish(null); }
  });
}
function distanceMeters(lat1,lng1,lat2,lng2){
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
const GEO_ALERT_METERS = 150; // au-delà de cette distance de l'établissement, la position est mise en avant dans le pointage
async function isWithinPlannedShift(memberName, dateIso, nowDate){
  const mk = dateIso.slice(0,7);
  const shifts = await getData(`log:${RESTAURANT_ID}:planning:${mk}`, true, []);
  const todays = shifts.filter(s=> s.staff===memberName && s.date===dateIso && s.start);
  if(!todays.length) return false; // aucun créneau prévu ce jour-là
  const nowMin = nowDate.getHours()*60 + nowDate.getMinutes();
  return todays.some(s=>{
    const [sh,sm] = s.start.split(':').map(Number);
    const startMin = sh*60+sm;
    let endMin = startMin + 8*60;
    if(s.end){
      const [eh,em] = s.end.split(':').map(Number);
      endMin = eh*60+em;
      if(endMin < startMin) endMin += 24*60; // créneau à cheval sur minuit
    }
    return nowMin >= startMin - SHIFT_TOLERANCE_MIN && nowMin <= endMin + SHIFT_TOLERANCE_MIN;
  });
}

async function syncPendingBadges(){

  const remaining = [];

  for(const item of list){
    try{
      const mk = monthKeyOf(new Date(item.ts));
      const resolvedType = item.type==='pause' ? await determinePauseType({id:item.memberId}) : item.type;
      const event = {id: item.id, memberId: item.memberId, name: item.memberName, type: resolvedType, ts: item.ts, syncedFromOffline:true};

async function addPointageEvent(member, type, signatureDataUrl, justification){
  if(!navigator.onLine){
    const now = new Date();
    queueBadgeOffline(member, type, now, signatureDataUrl);
    return {ok:true, now, queued:true};
  }

  const now = await getServerTime(); // heure réelle du serveur, insensible à l'horloge de l'appareil

  const mk = monthKeyOf(now);
  const arr = await loadPointageMonth(mk);
  const dateIso = now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());

  if(type==='arrivee' || type==='depart'){
    const todays = arr.filter(e=> e.memberId===member.id && e.ts.slice(0,10)===dateIso && (e.type==='arrivee'||e.type==='depart')).sort((a,b)=> a.ts.localeCompare(b.ts));
    const last = todays[todays.length-1];
    if(type==='arrivee' && last && last.type==='arrivee'){
      return {ok:false, error:'double_arrivee', lastTs:last.ts};
    }
    if(type==='depart' && (!last || last.type==='depart')){
      return {ok:false, error:'depart_sans_arrivee'};
    }
  }
  if(type==='jour_travaille'){
    const already = arr.find(e=> e.memberId===member.id && e.ts.slice(0,10)===dateIso && e.type==='jour_travaille');
    if(already) return {ok:false, error:'jour_deja_enregistre'};
  }

  const event = {id: uid('pt'), memberId: member.id, name: member.name, type, ts: now.toISOString()};
  const geo = await captureGeolocation();
  if(geo){
    event.location = geo;
    const rec = await getData(`restaurant:${RESTAURANT_ID}`, true, {});
    if(rec.location){
      event.distanceMeters = Math.round(distanceMeters(geo.lat, geo.lng, rec.location.lat, rec.location.lng));
    }
  }
  if(signatureDataUrl) event.signature = signatureDataUrl;
  if(type==='arrivee'){
    const plannedStart = await findPlannedStart(member.name, dateIso);
    if(plannedStart){
      const [ph,pm] = plannedStart.split(':').map(Number);
      event.plannedStart = plannedStart;
      event.diffMin = (now.getHours()*60+now.getMinutes()) - (ph*60+pm);
    }
    // arrivée hors planning (± 5 min de tolérance) : une justification est obligatoire,
    // l'action reste enregistrée (jamais bloquée) mais marquée en attente de validation
    const withinPlan = await isWithinPlannedShift(member.name, dateIso, now);
    if(!withinPlan){
      if(!justification) return {ok:false, error:'hors_planning'};
      event.offSchedule = true;
      event.justification = justification;
      event.validated = false;
    }
  }
  const saved = await appendToJsonArray(`log:${RESTAURANT_ID}:pointage:${mk}`, event);
  if(!saved){
    // l'appareil se croyait en ligne mais l'écriture a échoué : on ne perd pas le pointage pour autant
    queueBadgeOffline(member, type, now, signatureDataUrl);
    return {ok:true, now, queued:true};
  }
  return {ok:true, now};
}
function pairEvents(events){
  const sorted = events.slice().sort((a,b)=> a.ts.localeCompare(b.ts));
  const pairs = [];
  let openArrivee = null;
  sorted.forEach(e=>{
    if(e.type==='arrivee'){
      if(openArrivee) pairs.push({arrivee: openArrivee, depart: null});
      openArrivee = e;
    } else if(e.type==='depart'){
      if(openArrivee){ pairs.push({arrivee: openArrivee, depart: e}); openArrivee = null; }
      else pairs.push({arrivee: null, depart: e});
    }
  });
  if(openArrivee) pairs.push({arrivee: openArrivee, depart: null});
  return pairs;
}
function minutesBetweenISO(isoA, isoB){ return Math.round((new Date(isoB) - new Date(isoA)) / 60000); }

/* ---------- alertes légales de durée du travail (repères généraux du Code du travail) ----------
   Ce sont les règles générales du droit du travail français. Une convention collective (ex. HCR)
   ou un accord d'entreprise peut prévoir des règles différentes pour certains seuils (la durée
   quotidienne max peut par exemple être portée à 12h par dérogation dans certains cas). Ces
   alertes sont des repères pour t'aider à repérer un dépassement, pas un verdict juridique
   définitif — à faire valider avec un professionnel en cas de doute sur un cas précis.
*/
const LEGAL_LIMITS = {
  maxDailyMinutes: 10*60,       // durée quotidienne max : 10h (Code du travail, art. L3121-18)
  maxWeeklyMinutes: 48*60,      // durée hebdomadaire max absolue : 48h (art. L3121-20)
  minDailyRestMinutes: 11*60,   // repos quotidien minimum entre deux journées : 11h (art. L3131-1)
  breakAfterMinutes: 6*60,      // pause obligatoire après 6h de travail continu (art. L3121-16)
  minBreakMinutes: 20,          // durée minimale de cette pause : 20 min
};
function dailyLegalAlerts(netMinutes, pauseMinutes){
  const alerts = [];
  if(netMinutes > LEGAL_LIMITS.maxDailyMinutes) alerts.push(`Durée quotidienne max dépassée (${fmtHM(netMinutes)} > 10h)`);
  if(netMinutes > LEGAL_LIMITS.breakAfterMinutes && pauseMinutes < LEGAL_LIMITS.minBreakMinutes) alerts.push(`Plus de 6h travaillées sans pause d'au moins 20 min`);
  return alerts;
}
function weeklyLegalAlert(totalMinutes){
  return totalMinutes > LEGAL_LIMITS.maxWeeklyMinutes ? `Durée hebdomadaire max dépassée (${fmtHM(totalMinutes)} > 48h)` : null;
}
function restLegalAlert(prevDepartTs, nextArriveeTs){
  if(!prevDepartTs || !nextArriveeTs) return null;
  const restMin = minutesBetweenISO(prevDepartTs, nextArriveeTs);
  return restMin < LEGAL_LIMITS.minDailyRestMinutes ? `Repos entre deux journées trop court (${fmtHM(Math.max(0,restMin))} < 11h)` : null;
}
function computeLegalAlertsForRange(memberEvents){
  const byDay = {};
  memberEvents.forEach(e=>{ (byDay[e.ts.slice(0,10)] = byDay[e.ts.slice(0,10)] || []).push(e); });
  const dates = Object.keys(byDay).sort();
  const alerts = [];
  let periodTotal = 0;
  let lastDepart = null;
  dates.forEach(d=>{
    const dLabel = new Date(d+'T00:00:00').toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
    const dayPauseMin = pausePairs(byDay[d]).reduce((sum,p)=> sum + (p.debut && p.fin ? minutesBetweenISO(p.debut,p.fin) : 0), 0);
    const segments = pairEvents(byDay[d]);
    const dayGross = segments.reduce((sum,p)=> sum + (p.arrivee ? minutesBetweenISO(p.arrivee.ts, p.depart?p.depart.ts:new Date().toISOString()) : 0), 0);
    const dayNet = Math.max(0, dayGross - dayPauseMin);
    periodTotal += dayNet;
    dailyLegalAlerts(dayNet, dayPauseMin).forEach(a=> alerts.push(`${dLabel} — ${a}`));
    const firstArrivee = segments.find(p=>p.arrivee);
    if(lastDepart && firstArrivee && firstArrivee.arrivee){
      const restAlert = restLegalAlert(lastDepart, firstArrivee.arrivee.ts);
      if(restAlert) alerts.push(`${dLabel} — ${restAlert}`);
    }
    const lastSeg = [...segments].reverse().find(p=>p.depart);
    if(lastSeg) lastDepart = lastSeg.depart.ts;
  });
  return {alerts, periodTotal};
}
function fmtHM(mins){
  if(mins==null || isNaN(mins) || mins<0) return '--:--';
  return pad2(Math.floor(mins/60)) + ':' + pad2(mins%60);
}
function fmtHMShort(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return pad2(d.getHours())+':'+pad2(d.getMinutes());
}

  const canvas = document.getElementById('badgeSigCanvas');
  const ctx = canvas.getContext('2d');
  function resize(){

  }
  function start(e){ e.preventDefault(); drawing = true; hasDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }

function badgeFeedback(){
  if(navigator.vibrate){ try{ navigator.vibrate(120); }catch(e){} }
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  }catch(e){}
}

/* ---------- attestation de formation hygiène (photo ou fichier) ----------
   Stockée dans un document séparé par employé (config:{id}:hygieneCert:{memberId}), pas dans la
   fiche équipe elle-même, pour ne jamais risquer de faire dépasser la limite de taille Firestore
   si plusieurs employés ont une attestation jointe. Comme toute clé "config:", elle est enregistrée
   automatiquement dans le registre de l'établissement, donc couverte par les sauvegardes
   automatiques quotidiennes et par l'outil de suppression RGPD, comme le reste des données. */
const MAX_CERT_FILE_BYTES = 650*1024; // ~650 Ko avant encodage — marge de sécurité sous la limite Firestore de 1 Mo
function certFileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    if(file.type === 'application/pdf'){
      if(file.size > MAX_CERT_FILE_BYTES){ reject(new Error('Fichier PDF trop volumineux (max ~650 Ko). Essaie une photo à la place, ou un PDF plus léger.')); return; }
      const reader = new FileReader();
      reader.onload = ()=> resolve({dataUrl: reader.result, mimeType: 'application/pdf'});
      reader.onerror = reject;
      reader.readAsDataURL(file);
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1400; // plus grand qu'une photo de tâche classique : c'est un document à relire
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        if(dataUrl.length > MAX_CERT_FILE_BYTES*1.4){ reject(new Error("Photo trop volumineuse même après compression — réessaie avec un peu moins de détail (éloigne-toi légèrement).")); return; }
        resolve({dataUrl, mimeType: 'image/jpeg'});
      };
      img.onerror = ()=> reject(new Error('Fichier image illisible.'));
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- photo employé ----------
   Deux tailles générées à l'upload : une miniature (~100px) stockée directement sur la fiche
   équipe pour un affichage instantané dans la liste, et une version pleine taille (~900px)
   stockée à part (comme l'attestation d'hygiène), pour ne jamais alourdir la fiche équipe elle-même. */
function photoFileToDataUrls(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        function resized(maxW, quality){
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width*scale; canvas.height = img.height*scale;
          canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
          return canvas.toDataURL('image/jpeg', quality);
        }
        resolve({full: resized(900,0.75), thumb: resized(110,0.6)});
      };
      img.onerror = ()=> reject(new Error('Photo illisible.'));
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- incidents (renvoi d'un employé : tenue, retard, comportement...) ----------
   Un seul document par établissement (le volume attendu est faible — pas un événement quotidien),
   avec double signature (responsable + employé) pour en faire une pièce fiable à transmettre pour
   la gestion de la paie (ex : justifier une journée non travaillée). */
async function saveIncident(incident){
  const list = await getData(`config:${RESTAURANT_ID}:incidents`, true, []);
  list.push(incident);
  await setData(`config:${RESTAURANT_ID}:incidents`, list, true);
  return list;
}
async function loadIncidents(){
  return getData(`config:${RESTAURANT_ID}:incidents`, true, []);
}
async function findIncidentFor(employeeName, dateIso){
  const list = await loadIncidents();
  return list.find(i=> i.employeeName===employeeName && i.date===dateIso) || null;
}
const INCIDENT_REASONS = ['Tenue non conforme', 'Retard répété', 'Comportement', 'Autre'];

/* ---------- absences justifiées (arrêt maladie, congé exceptionnel...) ----------
   Différence volontaire avec les incidents : une seule signature (le/la responsable, qui
   confirme avoir bien reçu et enregistré le justificatif) — l'employé n'étant pas présent
   physiquement en cas d'arrêt maladie, on ne peut pas lui faire contre-signer sur place.
   Le justificatif (photo ou fichier) est stocké à part, comme l'attestation de formation hygiène,
   pour ne jamais alourdir le document principal. */
const ABSENCE_CATEGORIES = ['Maladie', 'Congé exceptionnel', 'Autre'];

/* ---------- échange de shift entre employés ----------
   Circuit : A propose un de ses créneaux (et, en option, un créneau de B en échange) → B doit
   accepter → un·e responsable ou une personne autorisée (permission "validateSwaps") doit valider
   → seulement alors le planning change réellement. Le/la responsable est notifié·e dans tous les cas,
   même quand c'est quelqu'un d'autre qui a validé. */
async function saveShiftSwap(swap){
  const list = await getData(`config:${RESTAURANT_ID}:shiftSwaps`, true, []);
  list.push(swap);
  await setData(`config:${RESTAURANT_ID}:shiftSwaps`, list, true);
  return list;
}
async function loadShiftSwaps(){
  return getData(`config:${RESTAURANT_ID}:shiftSwaps`, true, []);
}
async function updateShiftSwap(id, patch){
  const list = await getData(`config:${RESTAURANT_ID}:shiftSwaps`, true, []);
  const s = list.find(x=>x.id===id);
  if(s) Object.assign(s, patch);
  await setData(`config:${RESTAURANT_ID}:shiftSwaps`, list, true);
  return s;
}
async function loadUpcomingShifts(employeeName){
  const todayIso = todayISOHome();
  const months = [0,1,2].map(off=>{
    const d = new Date(); d.setMonth(d.getMonth()+off);
    return monthKeyOf(d);
  });
  const arrays = await Promise.all(months.map(mk => getData(`log:${RESTAURANT_ID}:planning:${mk}`, true, [])));
  return arrays.flat().filter(s => s.staff===employeeName && s.date >= todayIso).sort((a,b)=> (a.date+a.start).localeCompare(b.date+b.start));
}
function shiftLabel(s){
  return `${new Date(s.date+'T00:00:00').toLocaleDateString('fr-FR', {weekday:'short', day:'2-digit', month:'2-digit'})} · ${s.start||'--:--'}–${s.end||'--:--'}`;
}
async function applySwapToPlanning(swap){
  // échange effectif du/des créneau(x) une fois validé — ne touche qu'aux champs "staff" des créneaux concernés
  const mk1 = swap.requesterDate.slice(0,7);
  const arr1 = await getData(`log:${RESTAURANT_ID}:planning:${mk1}`, true, []);
  const shift1 = arr1.find(s=>s.id===swap.requesterShiftId);
  if(shift1) shift1.staff = swap.targetName;
  await setData(`log:${RESTAURANT_ID}:planning:${mk1}`, arr1, true);
  if(swap.targetShiftId){
    const mk2 = swap.targetDate.slice(0,7);
    if(mk2===mk1){
      const shift2 = arr1.find(s=>s.id===swap.targetShiftId);
      if(shift2) shift2.staff = swap.requesterName;
      await setData(`log:${RESTAURANT_ID}:planning:${mk1}`, arr1, true);
    } else {
      const arr2 = await getData(`log:${RESTAURANT_ID}:planning:${mk2}`, true, []);
      const shift2 = arr2.find(s=>s.id===swap.targetShiftId);
      if(shift2) shift2.staff = swap.requesterName;
      await setData(`log:${RESTAURANT_ID}:planning:${mk2}`, arr2, true);
    }
  }
}

/* ---------- "Mon planning" — vue employé, respecte la publication faite depuis planning.html ---------- */
function fmtISODate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function startOfWeekIso(d){
  const date = new Date(d); date.setHours(0,0,0,0);
  const day = date.getDay();
  const diff = (day===0 ? -6 : 1-day);
  date.setDate(date.getDate()+diff);
  return date;
}
function weekDaysFrom(weekStart){
  const days = [];
  for(let i=0;i<7;i++){ const d = new Date(weekStart); d.setDate(d.getDate()+i); days.push(d); }
  return days;
}
async function renderMyPlanning(weekStart){
  weekStart = weekStart || startOfWeekIso(new Date());
  const root = document.getElementById('root');
  const days = weekDaysFrom(weekStart);
  const weekStartIso = fmtISODate(weekStart);
  const months = [...new Set(days.map(d=>monthKeyOf(d)))];
  const [publishRecord, shiftArrays, notices] = await Promise.all([
    getData(`config:${RESTAURANT_ID}:planningPublish`, true, {}),
    Promise.all(months.map(mk=>getData(`log:${RESTAURANT_ID}:planning:${mk}`, true, []))),
    getData(`config:${RESTAURANT_ID}:planningNotices`, true, []),
  ]);
  const allShifts = shiftArrays.flat();
  const rec = publishRecord[weekStartIso];
  const isPublished = !!rec;
  // marque comme consultées les notifications de changement pour cette semaine
  const toMark = notices.filter(n=> sameName(n.employeeName, CURRENT_USER_NAME) && n.weekStart===weekStartIso && !n.seenAt);
  if(toMark.length){ toMark.forEach(n=> n.seenAt=new Date().toISOString()); setData(`config:${RESTAURANT_ID}:planningNotices`, notices, true); }

  const showAll = state_myPlanningShowAll || false;
  const weekLabel = `${days[0].toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})} – ${days[6].toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})} ${days[6].getFullYear()}`;

  const dayRows = days.map(d=>{
    const iso = fmtISODate(d);
    const dayShifts = allShifts.filter(s=>s.date===iso && (showAll || sameName(s.staff, CURRENT_USER_NAME))).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
    return `
    <div style="padding:12px 0;border-top:1px solid var(--line);">
      <div style="font-weight:700;font-size:13.5px;text-transform:capitalize;margin-bottom:6px;">${d.toLocaleDateString('fr-FR',{weekday:'long', day:'2-digit', month:'2-digit'})}</div>
      ${dayShifts.length ? dayShifts.map(s=>`
        <div style="font-size:13px;padding:4px 0;">${showAll?`<strong>${escapeHtml(s.staff)}</strong> · `:''}${s.start||'--:--'}–${s.end||'--:--'}${s.space?` · ${escapeHtml(s.space)}`:''}${s.note?` · <span class="sub">${escapeHtml(s.note)}</span>`:''}</div>
      `).join('') : `<div class="sub" style="font-size:12.5px;">${showAll?'Aucun créneau':'Rien de prévu'}</div>`}
    </div>`;
  }).join('');

  root.innerHTML = `
  <div class="auth-card" style="max-width:480px;text-align:left;">
    <button id="mpBack" class="auth-link" style="display:block;margin:0 0 10px;">← Retour à l'accueil</button>
    <h1 style="font-size:19px;text-align:center;">Mon planning</h1>
    <div style="display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;">
      <button id="mpPrev" class="mode-btn" style="padding:6px 12px;">←</button>
      <span style="font-weight:700;font-size:14px;text-transform:capitalize;">${weekLabel}</span>
      <button id="mpNext" class="mode-btn" style="padding:6px 12px;">→</button>
    </div>
    <div style="text-align:center;margin-bottom:10px;">
      <input type="date" id="mpJumpDate" value="${fmtISODate(weekStart)}" style="font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;">
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;justify-content:center;margin-bottom:10px;">
      <input type="checkbox" id="mpShowAll" ${showAll?'checked':''}> Voir toute l'équipe
    </label>
    ${!isPublished ? `
      <p class="sub" style="text-align:center;background:#FBE7E1;border-radius:10px;padding:12px;">🔴 Le planning de cette semaine n'a pas encore été publié.</p>
    ` : dayRows}
    <button id="mpBackBottom" class="auth-link" style="display:block;margin:16px auto 0;">← Retour à l'accueil</button>
  </div>`;
  document.getElementById('mpBack').onclick = renderHome;
  document.getElementById('mpBackBottom').onclick = renderHome;
  document.getElementById('mpPrev').onclick = ()=>{ const d = new Date(weekStart); d.setDate(d.getDate()-7); renderMyPlanning(d); };
  document.getElementById('mpNext').onclick = ()=>{ const d = new Date(weekStart); d.setDate(d.getDate()+7); renderMyPlanning(d); };
  document.getElementById('mpShowAll').onchange = (e)=>{ state_myPlanningShowAll = e.target.checked; renderMyPlanning(weekStart); };
  document.getElementById('mpJumpDate').onchange = (e)=>{
    if(!e.target.value) return;
    const d = new Date(e.target.value+'T00:00:00');
    renderMyPlanning(startOfWeekIso(d));
  };
}

  const endDate = inc.endDate || inc.date; // rétrocompatibilité avec les incidents créés avant l'ajout de ce champ

    return `${dateLabel} à ${inc.time||'--:--'}${inc.endTime ? ' — jusqu\'à '+inc.endTime : ' (jusqu\'à la fin de journée)'}`;
  }
  const endLabel = new Date(endDate+'T00:00:00').toLocaleDateString('fr-FR');
  return `Du ${dateLabel} ${inc.time||'--:--'} au ${endLabel}${inc.endTime?' '+inc.endTime:''}`;
}
function incidentTypeLabel(inc){
  const endDate = inc.endDate || inc.date;
  return endDate === inc.date ? 'Renvoi journalier' : 'Mise à pied';
}

function renderIncidentSignature(draft, role, displayName, onDone){
  const root = document.getElementById('root');
  root.innerHTML = `
  <div class="auth-card">
    <h1 style="font-size:18px;">Signature — ${escapeHtml(displayName)}</h1>
    <p class="sub">${role==='responsable' ? 'La personne à l\'origine du signalement signe pour le confirmer.' : "Passe l'appareil à l'employé·e concerné·e pour qu'il/elle signe."}</p>

      Motif du renvoi : ${escapeHtml(draft.reasonCategory)}<br>
      ${escapeHtml(draft.details)}
    </div>
    <canvas id="incSigCanvas" class="sig-canvas"></canvas>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button id="incSigClear" class="mode-btn" style="flex:1;">Effacer</button>
      <button id="incSigValidate" class="auth-btn" style="margin:0;flex:1;">Valider</button>
    </div>
    <button id="incSigBack" class="auth-link">← Retour</button>
  </div>`;
  const canvas = document.getElementById('incSigCanvas');
  const ctx = canvas.getContext('2d');
  function resize(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2; canvas.height = rect.height * 2;
    ctx.scale(2,2); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = themeVar('--sea-deep');
  }
  resize();
  let drawing = false, hasDrawn = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x: p.clientX-rect.left, y: p.clientY-rect.top};
  }
  function start(e){ e.preventDefault(); drawing = true; hasDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);
  document.getElementById('incSigClear').onclick = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; };
  document.getElementById('incSigBack').onclick = renderIncidentNew;
  document.getElementById('incSigValidate').onclick = ()=>{
    if(!hasDrawn){ toast('Signe avant de valider.'); return; }
    onDone(canvas.toDataURL('image/png'));
  };
}

async function saveTipDistribution(dist){

}
async function loadTipDistributions(){
  return getData(`config:${RESTAURANT_ID}:tipDistributions`, true, []);
}
function datesBetween(startDate, endDate){
  const dates = [];
  let d = new Date(startDate+'T00:00:00');
  const end = new Date(endDate+'T00:00:00');
  while(d <= end){
    dates.push(d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()));
    d.setDate(d.getDate()+1);
  }
  return dates;
}
function tipPeriodLabel(dist){
  const startLabel = new Date(dist.startDate+'T00:00:00').toLocaleDateString('fr-FR');
  if(dist.endDate === dist.startDate) return `Le ${startLabel}`;
  const endLabel = new Date(dist.endDate+'T00:00:00').toLocaleDateString('fr-FR');
  return `Du ${startLabel} au ${endLabel}`;
}

function renderTipSelection({startDate, endDate, totalAmount, team, hoursByName}){
  const root = document.getElementById('root');
  const sorted = [...team].sort((a,b)=> a.name.localeCompare(b.name));
  root.innerHTML = `

    <div style="display:flex;flex-direction:column;gap:2px;margin-bottom:16px;">
      ${sorted.map(m=>{
        const postes = m.postes||[];
        const isSalleBar = postes.includes('salle') || postes.includes('bar');
        const minutes = hoursByName[m.name]||0;
        const checked = isSalleBar && minutes>0;
        return `<label style="display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;">

/* ---------- tendances (conformité HACCP, absentéisme, incidents dans le temps) ----------
   Contrainte technique à respecter : les relevés de température sont stockés par mois (1 lecture
   = tout le mois), donc efficaces à lire sur 6 mois. Les tâches quotidiennes, elles, sont stockées
   JOUR PAR JOUR — les lire sur 6 mois demanderait ~540 lectures. On limite donc leur historique à
   14 jours, ce qui reste raisonnable (42 lectures : 14 jours × 3 espaces). */
const TREND_SPACES = ['cuisine','salle','bar'];
function lastNMonths(n){
  const out = [];
  const d = new Date();
  for(let i=n-1;i>=0;i--){
    const m = new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(m.getFullYear()+'-'+pad2(m.getMonth()+1));
  }
  return out;
}
function lastNDays(n){
  const out = [];
  for(let i=n-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    out.push(d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()));
  }
  return out;
}
function trendBarRow(label, pct, extraLabel){
  const color = pct===null ? 'var(--line)' : (pct>=90?'#3E8E63':pct>=70?'#E0A100':'#B23B3B');
  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">
    <span style="width:52px;font-size:11px;flex-shrink:0;">${label}</span>
    <div style="flex:1;background:var(--sand);border-radius:6px;height:10px;overflow:hidden;"><div style="width:${pct===null?0:pct}%;height:100%;background:${color};"></div></div>
    <span style="font-size:11px;font-weight:700;width:44px;text-align:right;flex-shrink:0;">${pct===null?'—':pct+'%'}</span>
    ${extraLabel?`<span class="sub" style="font-size:10px;width:50px;flex-shrink:0;">${extraLabel}</span>`:''}
  </div>`;
}

async function renderTrendsDashboard(){
  const root = document.getElementById('root');
  root.innerHTML = `<div class="auth-card" style="max-width:520px;text-align:left;"><p class="sub" style="text-align:center;">Calcul des tendances…</p></div>`;

  const months = lastNMonths(6);
  const days = lastNDays(14);

  // --- conformité température (6 mois, lecture efficace : 1 doc = 1 mois) ---
  const tempByMonth = await Promise.all(months.map(async mk=>{
    const readings = (await Promise.all(TREND_SPACES.map(sp=> getData(`log:${RESTAURANT_ID}:${sp}:temp:${mk}`, true, [])))).flat();
    if(!readings.length) return null;
    const ok = readings.filter(r=>r.ok).length;
    return Math.round((ok/readings.length)*100);
  }));

  // --- tâches complétées (14 jours, lecture jour par jour car stockage quotidien) ---
  const tasksByDay = await Promise.all(days.map(async d=>{
    const logs = await Promise.all(TREND_SPACES.map(sp=> getData(`log:${RESTAURANT_ID}:${sp}:tasks:${d}`, true, {})));
    let done=0, total=0;
    logs.forEach(log=>{ Object.values(log).forEach(v=>{ total++; if(v) done++; }); });
    if(total===0) return null;
    return Math.round((done/total)*100);
  }));

  // --- absentéisme (6 mois, 2 lectures totales) ---
  const [absJust, absUnjust, incidents] = await Promise.all([loadAbsences(), loadUnexcusedAbsences(), loadIncidents()]);
  function countDaysInMonth(list, mk){
    let n = 0;
    list.forEach(a=>{
      const start = a.startDate||a.date, end = a.endDate||a.date;
      let d = new Date(start+'T00:00:00'); const endD = new Date(end+'T00:00:00');
      while(d<=endD){ if((d.getFullYear()+'-'+pad2(d.getMonth()+1))===mk) n++; d.setDate(d.getDate()+1); }
    });
    return n;
  }
  const absByMonth = months.map(mk=> countDaysInMonth(absJust,mk) + countDaysInMonth(absUnjust,mk));
  const maxAbs = Math.max(1, ...absByMonth);
  const incByMonth = months.map(mk=> incidents.filter(i=> (i.date||'').slice(0,7)===mk).length);
  const maxInc = Math.max(1, ...incByMonth);

  const monthLabel = mk => new Date(mk+'-01T00:00:00').toLocaleDateString('fr-FR',{month:'short'});
  const dayLabel = d => new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});

  root.innerHTML = `
  <div class="auth-card" style="max-width:520px;text-align:left;">
    <button id="trendsBack" class="auth-link" style="display:block;margin:0 0 10px;">← Retour à l'accueil</button>
    <h1 style="font-size:19px;text-align:center;">Tendances</h1>
    <p class="sub" style="text-align:center;">${escapeHtml(RESTAURANT_NAME||'')}</p>

    <h3 style="font-size:14.5px;margin-top:22px;">Conformité des températures — 6 derniers mois</h3>
    <p class="sub" style="font-size:11px;margin:-4px 0 8px;">Cuisine + salle + bar confondus. "—" = aucun relevé ce mois-là.</p>
    ${months.map((mk,i)=> trendBarRow(monthLabel(mk), tempByMonth[i])).join('')}

    <h3 style="font-size:14.5px;margin-top:22px;">Tâches complétées — 14 derniers jours</h3>
    <p class="sub" style="font-size:11px;margin:-4px 0 8px;">Cuisine + salle + bar confondus.</p>
    ${days.map((d,i)=> trendBarRow(dayLabel(d), tasksByDay[i])).join('')}

    <h3 style="font-size:14.5px;margin-top:22px;">Absentéisme — 6 derniers mois</h3>
    <p class="sub" style="font-size:11px;margin:-4px 0 8px;">Jours cumulés (absences justifiées + non justifiées).</p>
    ${months.map((mk,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">
      <span style="width:52px;font-size:11px;flex-shrink:0;">${monthLabel(mk)}</span>
      <div style="flex:1;background:var(--sand);border-radius:6px;height:10px;overflow:hidden;"><div style="width:${Math.round(absByMonth[i]/maxAbs*100)}%;height:100%;background:var(--sea-deep);"></div></div>
      <span style="font-size:11px;font-weight:700;width:44px;text-align:right;flex-shrink:0;">${absByMonth[i]} j</span>
    </div>`).join('')}

    <h3 style="font-size:14.5px;margin-top:22px;">Incidents (renvois) — 6 derniers mois</h3>
    ${months.map((mk,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">
      <span style="width:52px;font-size:11px;flex-shrink:0;">${monthLabel(mk)}</span>
      <div style="flex:1;background:var(--sand);border-radius:6px;height:10px;overflow:hidden;"><div style="width:${Math.round(incByMonth[i]/maxInc*100)}%;height:100%;background:var(--alert);"></div></div>
      <span style="font-size:11px;font-weight:700;width:44px;text-align:right;flex-shrink:0;">${incByMonth[i]}</span>
    </div>`).join('')}

    <button id="trendsBackBottom" class="auth-link" style="display:block;margin:18px auto 0;">← Retour à l'accueil</button>
  </div>`;
  document.getElementById('trendsBack').onclick = renderHome;
  document.getElementById('trendsBackBottom').onclick = renderHome;
}

async function renderAccountingExportResult(mk){
  const root = document.getElementById('root');
  const [events, incidents, absences, unexcused] = await Promise.all([
    loadPointageMonth(mk),
    loadIncidents(),
    loadAbsences(),
    loadUnexcusedAbsences(),
  ]);
  const monthLabel = new Date(mk+'-01T00:00:00').toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  const inMonth = d => d && d.slice(0,7)===mk;
  const overlapsMonth = (start,end) => start && end && start.slice(0,7)<=mk && end.slice(0,7)>=mk;

  const byMember = {};
  events.forEach(e=>{ (byMember[e.name] = byMember[e.name] || []).push(e); });
  const hoursRows = Object.keys(byMember).sort().map(name=>{
    const {periodTotal} = computeLegalAlertsForRange(byMember[name]);
    return `<tr><td>${escapeHtml(name)}</td><td>${fmtHM(periodTotal)}</td></tr>`;
  }).join('');

  const incRows = incidents.filter(i=> inMonth(i.date) || overlapsMonth(i.date, i.endDate||i.date))
    .map(i=>`<tr><td>${escapeHtml(i.employeeName)}</td><td>${incidentTypeLabel(i)}</td><td>${escapeHtml(i.reasonCategory)}</td><td>${incidentPeriodLabel(i)}</td></tr>`).join('');

  const absRows = absences.filter(a=> overlapsMonth(a.startDate, a.endDate))
    .map(a=>`<tr><td>${escapeHtml(a.employeeName)}</td><td>${escapeHtml(a.category)}</td><td>${absencePeriodLabel(a)}</td><td>${a.justificatifMeta?'Oui':'Non'}</td></tr>`).join('');

  const uabsRows = unexcused.filter(a=> overlapsMonth(a.startDate, a.endDate))
    .map(a=>`<tr><td>${escapeHtml(a.employeeName)}</td><td>${absencePeriodLabel(a)}</td><td>${escapeHtml(a.details)}</td></tr>`).join('');

  root.innerHTML = `
  <div class="auth-card" style="max-width:640px;text-align:left;">
    <button id="acctResBack" class="auth-link no-print" style="display:block;margin:0 0 10px;">← Retour</button>
    <h1 style="font-size:19px;text-align:center;">Export comptable</h1>
    <p class="sub" style="text-align:center;text-transform:capitalize;">${escapeHtml(RESTAURANT_NAME||'')} — ${monthLabel}</p>

    <h3 style="font-size:14.5px;margin-top:20px;">Heures travaillées par employé</h3>
    ${hoursRows ? `<table class="pt-table"><thead><tr><th>Employé</th><th>Total du mois</th></tr></thead><tbody>${hoursRows}</tbody></table>` : `<p class="sub">Aucun pointage ce mois-ci.</p>`}

    <h3 style="font-size:14.5px;margin-top:20px;">Incidents (renvois)</h3>
    ${incRows ? `<table class="pt-table"><thead><tr><th>Employé</th><th>Type</th><th>Motif</th><th>Période</th></tr></thead><tbody>${incRows}</tbody></table>` : `<p class="sub">Aucun incident ce mois-ci.</p>`}

    <h3 style="font-size:14.5px;margin-top:20px;">Absences justifiées</h3>
    ${absRows ? `<table class="pt-table"><thead><tr><th>Employé</th><th>Catégorie</th><th>Période</th><th>Justificatif</th></tr></thead><tbody>${absRows}</tbody></table>` : `<p class="sub">Aucune absence justifiée ce mois-ci.</p>`}

    <h3 style="font-size:14.5px;margin-top:20px;">Absences non justifiées</h3>
    ${uabsRows ? `<table class="pt-table"><thead><tr><th>Employé</th><th>Période</th><th>Circonstances</th></tr></thead><tbody>${uabsRows}</tbody></table>` : `<p class="sub">Aucune absence non justifiée ce mois-ci.</p>`}

    <button id="acctPrint" class="auth-btn no-print" style="margin-top:20px;">🖨️ Imprimer / enregistrer en PDF</button>
    <button id="acctResBackBottom" class="auth-link no-print" style="display:block;margin:14px auto 0;">← Retour à l'accueil</button>
  </div>`;
  const incFiltered = incidents.filter(i=> inMonth(i.date) || overlapsMonth(i.date, i.endDate||i.date));
  const absFiltered = absences.filter(a=> overlapsMonth(a.startDate, a.endDate));
  const uabsFiltered = unexcused.filter(a=> overlapsMonth(a.startDate, a.endDate));
  const hoursNames = Object.keys(byMember).sort();

  document.getElementById('acctResBack').onclick = renderAccountingExport;
  document.getElementById('acctResBackBottom').onclick = renderHome;
  document.getElementById('acctPrint').onclick = ()=>{
    buildSimplePdf(
      'Export comptable',
      `${RESTAURANT_NAME||''} — ${monthLabel}`,
      [{
        heading: 'Heures travaillées par employé',
        columns: ['Employé','Total du mois'],
        rows: hoursNames.map(name=>[name, fmtHM(computeLegalAlertsForRange(byMember[name]).periodTotal)]),
        emptyText: 'Aucun pointage ce mois-ci.',
      }, {
        heading: 'Incidents (renvois)',
        columns: ['Employé','Type','Motif','Période'],
        rows: incFiltered.map(i=>[i.employeeName, incidentTypeLabel(i), i.reasonCategory, incidentPeriodLabel(i)]),
        emptyText: 'Aucun incident ce mois-ci.',
      }, {
        heading: 'Absences justifiées',
        columns: ['Employé','Catégorie','Période','Justificatif'],
        rows: absFiltered.map(a=>[a.employeeName, a.category, absencePeriodLabel(a), a.justificatifMeta?'Oui':'Non']),
        emptyText: 'Aucune absence justifiée ce mois-ci.',
      }, {
        heading: 'Absences non justifiées',
        columns: ['Employé','Période','Circonstances'],
        rows: uabsFiltered.map(a=>[a.employeeName, absencePeriodLabel(a), a.details]),
        emptyText: 'Aucune absence non justifiée ce mois-ci.',
      }],
      `export-comptable-${mk}.pdf`
    );
  };
}

async function saveResponsableSignature(periodKey, name, dataUrl){
  const all = (await getData(`config:${RESTAURANT_ID}:pointageSignatures:${periodKey}`, true, {}));
  all[name] = {...(all[name]||{}), responsableDataUrl: dataUrl, responsableSignedAt: new Date().toISOString(), responsableSignedBy: CURRENT_USER_NAME};
  await setData(`config:${RESTAURANT_ID}:pointageSignatures:${periodKey}`, all, true);
}
async function requestSignature(periodKey, periodLabel, name){
  const all = (await getData(`config:${RESTAURANT_ID}:pointageSignatures:${periodKey}`, true, {}));
  all[name] = {...(all[name]||{}), requestedAt: new Date().toISOString(), periodLabel};
  await setData(`config:${RESTAURANT_ID}:pointageSignatures:${periodKey}`, all, true);
  // marque aussi la fiche de l'employé (source unique pour le point rouge sur "Qui es-tu ?" et le bandeau)
  const team = await getData(`config:${RESTAURANT_ID}:team`, true, []);
  const m = findTeamMember(team, name);
  if(m){
    m.pendingSignatureRequest = {periodKey, periodLabel, weekStart: periodKey.replace('week-','')};
    await setData(`config:${RESTAURANT_ID}:team`, team, true);
  }
}
async function clearPendingSignatureRequest(name){
  const team = await getData(`config:${RESTAURANT_ID}:team`, true, []);
  const m = findTeamMember(team, name);
  if(m && m.pendingSignatureRequest){
    m.pendingSignatureRequest = null;
    await setData(`config:${RESTAURANT_ID}:team`, team, true);
  }
}
async function markSignedPendingAck(name, periodKey, periodLabel){
  const team = await getData(`config:${RESTAURANT_ID}:team`, true, []);
  const m = findTeamMember(team, name);
  if(m){
    m.signedPendingAck = {periodKey, periodLabel, signedAt: new Date().toISOString()};
    await setData(`config:${RESTAURANT_ID}:team`, team, true);
  }
}
async function clearSignedPendingAck(name){
  const team = await getData(`config:${RESTAURANT_ID}:team`, true, []);
  const m = findTeamMember(team, name);
  if(m && m.signedPendingAck){
    m.signedPendingAck = null;
    await setData(`config:${RESTAURANT_ID}:team`, team, true);
  }
}
// vérifie, sur les N dernières semaines, si une demande de signature attend encore l'employé connecté
// (pas de requête "liste" possible — on relit simplement chaque semaine récente une par une)
async function findPendingSignatureRequest(name){
  const team = await getData(`config:${RESTAURANT_ID}:team`, true, []);
  const m = findTeamMember(team, name);
  return (m && m.pendingSignatureRequest) || null;
}

/* ---------- export complet des données (sauvegarde manuelle) ---------- */
async function exportAllData(){
  toast("Préparation de l'export…");
  const rid = RESTAURANT_ID;
  const months = [];
  const now = new Date();
  for(let i=0;i<24;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d.getFullYear()+'-'+pad2(d.getMonth()+1));
  }
  const spaces = ['cuisine','salle','bar'];
  const keys = [
    `restaurant:${rid}`, `config:${rid}:team`, `config:${rid}:planning:template`,
    `config:${rid}:pointageSettings`, `config:${rid}:archivedTimesheets`,
    `reservation:${rid}:config`, `reservation:${rid}:tables`, `reservation:${rid}:reservations`,
    `errorLog:${rid}`,
  ];
  spaces.forEach(sp=>{
    keys.push(`config:${rid}:${sp}:staff`, `config:${rid}:${sp}:equipments`, `config:${rid}:${sp}:tasks`);
    months.forEach(m=> keys.push(`log:${rid}:${sp}:temp:${m}`, `log:${rid}:${sp}:trace:${m}`, `log:${rid}:${sp}:photos:${m}`));
  });
  months.forEach(m=> keys.push(`log:${rid}:planning:${m}`, `log:${rid}:pointage:${m}`));

  const values = await Promise.all(keys.map(k=> getData(k, true, null)));
  const result = {};
  keys.forEach((k,i)=>{ if(values[i]!==null) result[k] = values[i]; });

  const blob = new Blob([JSON.stringify(result, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `export-${rid}-${todayISOHome()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Export téléchargé ✓');
}

function daysInMonth(mk){
  const [y,m] = mk.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  return Array.from({length:last}, (_,i)=> mk+'-'+pad2(i+1));
}
function mondayOf(dateIso){
  const d = new Date(dateIso+'T00:00:00');
  const day = d.getDay();
  d.setDate(d.getDate() + (day===0 ? -6 : 1-day));
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function weekDatesFor(mondayIso){
  const start = new Date(mondayIso+'T00:00:00');
  return Array.from({length:7}, (_,i)=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); });
}
function monthLabelFor(mk){ return new Date(mk+'-01T00:00:00').toLocaleDateString('fr-FR', {month:'long', year:'numeric'}); }
function weekLabelFor(mondayIso){
  const start = new Date(mondayIso+'T00:00:00');
  const end = new Date(start); end.setDate(end.getDate()+6);
  return `Semaine du ${start.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} au ${end.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}`;
}
async function loadPointageForDates(dates){
  const mks = [...new Set(dates.map(d=>d.slice(0,7)))];
  const chunks = await Promise.all(mks.map(loadPointageMonth));
  const all = chunks.flat();
  return all.filter(e=> dates.includes(e.ts.slice(0,10)));
}

  const ctx = canvas.getContext('2d');
  function resize(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * 2; canvas.height = rect.height * 2;
    ctx.scale(2,2); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = themeVar('--sea-deep');
  }
  resize();
  let drawing = false, hasDrawn = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x: p.clientX-rect.left, y: p.clientY-rect.top};
  }
  function start(e){ e.preventDefault(); drawing = true; hasDrawn = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);
  document.getElementById('sigClear').onclick = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; };
  document.getElementById('sigCancel').onclick = ()=> renderPeriodRecap(name, periodKey, periodLabel, candidateDates);
  document.getElementById('sigSave').onclick = async ()=>{
    if(!hasDrawn){ toast('Signe avant de valider.'); return; }
    const dataUrl = canvas.toDataURL('image/png');
    if(role==='responsable'){
      await saveResponsableSignature(periodKey, name, dataUrl);
      toast('Signature responsable enregistrée.');
      renderPeriodRecap(name, periodKey, periodLabel, candidateDates);
      return;
    }
    await saveSignature(periodKey, name, dataUrl);
    await clearPendingSignatureRequest(name); // éteint le point rouge sur "Qui es-tu ?"
    await markSignedPendingAck(name, periodKey, periodLabel); // prévient le responsable
    await archiveTimesheet({
      id: uid('arch'),
      employeeName: name,
      employeeEmail: member ? (member.email||'') : '',
      employeePhone: member ? (member.phone||'') : '',
      employeeAddress: member ? (member.address||'') : '',
      periodKey, periodLabel,
      signedAt: new Date().toISOString(),
      signedBy: CURRENT_USER_NAME || name,
      dataUrl,
      grandTotal,
      days: snapshotDays
    });
    toast('Signature enregistrée et archivée.');
    renderPeriodRecap(name, periodKey, periodLabel, candidateDates);
  };
}

      <tbody>${rows.join('')}</tbody></table>` : `<p class="sub" style="text-align:center;">Aucun pointage cette année-là.</p>`;
  }

function todayISOHome(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const DEFAULT_TASK_IDS = {
  cuisine: ['t1','t2','t3','t4','t5','t6','t7','t8'],
  salle:   ['t1','t2','t3','t4','t5','t6','t7','t8','t9'],
  bar:     ['t1','t2','t3','t4','t5','t6','t7','t8','t9'],
};
const ONBOARD_SKIP_KEY = 'checkTaCuisine_onboardSkip';
async function computeOnboardingStatus(){
  const [team, cuisineTasks, salleTasks, barTasks, planningTemplate, restaurantRec] = await Promise.all([
    getData(`config:${RESTAURANT_ID}:team`, true, []),
    getData(`config:${RESTAURANT_ID}:cuisine:tasks`, true, null),
    getData(`config:${RESTAURANT_ID}:salle:tasks`, true, null),
    getData(`config:${RESTAURANT_ID}:bar:tasks`, true, null),
    getData(`config:${RESTAURANT_ID}:planning:template`, true, null),
    getData(`restaurant:${RESTAURANT_ID}`, true, {}),
  ]);
  const steps = [
    { key:'team', title:"Ajoute ton équipe", sub:"Prénoms, codes personnels, accès par poste", href:'#team',
      done: team.length > 0 },
    { key:'tasks', title:"Personnalise tes tâches HACCP", sub:"Adapte les listes à ta cuisine, ta salle, ton bar", href:'#tasks',
      done: !!(cuisineTasks || salleTasks || barTasks) },
    { key:'planning', title:"Configure ton planning type", sub:"Horaires par jour de semaine, par espace", href:'#planning',
      done: !!(planningTemplate && Object.keys(planningTemplate).length) },
    { key:'recovery', title:"Ajoute ton email de récupération", sub:"Pour ne jamais rester bloqué·e dehors", href:'#recovery',
      done: !!restaurantRec.recoveryEmail },
  ];
  const doneCount = steps.filter(s=>s.done).length;
  const skipped = sessionStorage.getItem(ONBOARD_SKIP_KEY) === 'true';
  return { steps, doneCount, allDone: doneCount===steps.length || skipped };
}
async function countUnseenReservations(){
  const list = await getData(`reservation:${RESTAURANT_ID}:reservations`, true, []);
  return list.filter(r=>r.staffSeen===false && r.status!=='annulee').length;
}
async function computeSpaceTaskStatus(){
  const spaces = ['cuisine','salle','bar'];
  const today = todayISOHome();
  const results = {};
  await Promise.all(spaces.map(async sp=>{
    const [tasksRaw, log] = await Promise.all([
      getData(`config:${RESTAURANT_ID}:${sp}:tasks`, true, null),
      getData(`log:${RESTAURANT_ID}:${sp}:tasks:${today}`, true, {})
    ]);
    const taskIds = (tasksRaw !== null) ? tasksRaw.map(t=>t.id) : DEFAULT_TASK_IDS[sp];
    const total = taskIds.length;
    const done = taskIds.filter(id=> log[id] && log[id].done).length;
    results[sp] = {total, done, complete: total===0 ? true : done===total};
  }));
  return results;
}
async function resolveTraceEntry(spaceKey, traceId){
  const mk = todayISOHome().slice(0,7);
  const key = `log:${RESTAURANT_ID}:${spaceKey}:trace:${mk}`;
  const list = await getData(key, true, []);
  const entry = list.find(e=>e.id===traceId);
  if(entry){
    entry.resolved = true;
    entry.resolvedAt = new Date().toISOString();
    entry.resolvedBy = CURRENT_USER_NAME || 'Responsable';
    await setData(key, list, true);
  }
}

async function buildDashboardAlertsHtml(visibleSpaceKeys){
  const ALL_SPACES = [{key:'cuisine', label:'Cuisine'}, {key:'salle', label:'Salle'}, {key:'bar', label:'Bar'}];
  const SPACES = visibleSpaceKeys ? ALL_SPACES.filter(s=>visibleSpaceKeys.includes(s.key)) : ALL_SPACES;
  if(!SPACES.length) return '';
  const today = todayISOHome();
  const mk = today.slice(0,7);
  const results = await Promise.all(SPACES.map(async sp=>{
    const [temp, trace] = await Promise.all([
      getData(`log:${RESTAURANT_ID}:${sp.key}:temp:${mk}`, true, []),
      getData(`log:${RESTAURANT_ID}:${sp.key}:trace:${mk}`, true, []),
    ]);
    const tempAlerts = temp.filter(e=> e.ts && e.ts.slice(0,10)===today && e.ok===false);
    const dlcAlerts = trace.filter(e=> e.type==='dlc' && e.date && !e.resolved).map(e=>{
      const diff = Math.round((new Date(e.date+'T00:00:00') - new Date(today+'T00:00:00')) / 86400000);
      return Object.assign({}, e, {diff});
    }).filter(e=> e.diff<=3);
    return {space: sp.label, spaceKey: sp.key, tempAlerts, dlcAlerts};
  }));
  const anyAlert = results.some(r=> r.tempAlerts.length || r.dlcAlerts.length);
  if(!anyAlert){
    const spaceNames = SPACES.map(s=>s.label).join(', ');
    return `<div class="dash-card dash-ok">
      <div class="dash-title">✓ Tout est en ordre</div>

  }
  let rows = '';
  results.forEach(r=>{
    r.tempAlerts.forEach(e=>{
      rows += `<div class="dash-row"><span class="dash-badge">${escapeHtml(r.space)}</span>${escapeHtml(e.equipmentName||'Température')} — ${e.value}°C hors norme</div>`;

  return `<div class="dash-card dash-alert">

  </div>`;
}

async function renderRecoveryEmailSetup(){
  const root = document.getElementById('root');
  root.innerHTML = `
  <div class="auth-card">
    <h1 style="font-size:19px;">Email de récupération</h1>
    <p class="sub" style="margin-bottom:18px;">Sert uniquement à recevoir un lien si le mot de passe de l'établissement est un jour oublié. Personne d'autre ne le voit.</p>
    <input id="recovery-email-input-quick" type="email" class="auth-input" placeholder="ton@email.fr">
    <p id="recovery-email-quick-error" class="auth-error" style="display:none;"></p>
    <button id="recovery-email-quick-save" class="auth-btn">Enregistrer</button>
    <button id="recovery-email-quick-skip" class="auth-link">Plus tard</button>
  </div>`;
  document.getElementById('recovery-email-input-quick').focus();
  document.getElementById('recovery-email-quick-skip').onclick = renderHome;
  document.getElementById('recovery-email-quick-save').onclick = async ()=>{
    const email = document.getElementById('recovery-email-input-quick').value.trim();
    const errEl = document.getElementById('recovery-email-quick-error');
    if(!isValidEmail(email)){ errEl.textContent = 'Adresse email invalide.'; errEl.style.display='block'; return; }
    try{
      const user = firebase.auth().currentUser;
      if(user) await user.updateEmail(email);
      const rec = await getData(`restaurant:${RESTAURANT_ID}`, true, {});
      rec.recoveryEmail = email;
      await setRestaurantRecord(RESTAURANT_ID, rec);
      toast('Email de récupération enregistré ✓');
      renderHome();
    }catch(e){
      if(e.code === 'auth/requires-recent-login'){
        errEl.textContent = 'Reconnecte-toi (déconnexion puis reconnexion) et réessaie.';
      } else {
        errEl.textContent = 'Erreur : '+(e.message||'réessaie');
      }
      errEl.style.display='block';
    }
  };
}

async function renderBackups(){
  const root = document.getElementById('root');
  let dates = [];
  let loadError = null;
  try{
    dates = await listBackupDates(RESTAURANT_ID);
  }catch(e){
    loadError = e.message || String(e);
    if(typeof logAppError==='function') logAppError({message:'Échec chargement liste des sauvegardes : '+e.message, stack: e.stack});
  }
  root.innerHTML = `
  <div class="auth-card" style="max-width:420px;text-align:left;">
    <button id="backups-back-top" class="auth-link" style="display:block;margin:0 0 10px;">← Retour à l'accueil</button>
    <h1 style="font-size:19px;text-align:center;">Sauvegardes automatiques</h1>
    ${loadError ? `<p class="auth-error">Impossible de charger les sauvegardes : ${escapeHtml(loadError)}<br>Vérifie le journal d'erreurs, ou contacte le support technique avec ce message.</p>` : ''}
    <p class="sub" style="text-align:left;">Une copie de toutes les données de l'établissement est faite automatiquement une fois par jour (à la première connexion responsable de la journée). Les ${BACKUP_RETENTION} dernières sont conservées.</p>
    <p class="sub" style="text-align:left;font-size:11.5px;">⚠️ Ces sauvegardes vivent dans le même projet Firebase — elles protègent contre une erreur ou une suppression accidentelle dans l'appli, pas contre la perte du projet lui-même.</p>
    <div style="height:1px;background:var(--line);margin:14px 0;"></div>
    ${dates.length ? dates.map(d=>`
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);">
        <span style="font-weight:700;font-size:13.5px;">${escapeHtml(d)}</span>
        <div style="display:flex;gap:8px;">
          <button data-restore="${escapeAttr(d)}" class="auth-link" style="margin:0;">Restaurer</button>
          <button data-delbackup="${escapeAttr(d)}" class="auth-link" style="margin:0;color:var(--alert);">Supprimer</button>
        </div>
      </div>
    `).join('') : '<p class="sub">Aucune sauvegarde pour le moment — la première sera créée à ta prochaine connexion.</p>'}
    <button id="backup-now-btn" class="auth-btn" style="margin-top:16px;">Sauvegarder maintenant</button>
    <button id="backups-back-bottom" class="auth-link" style="display:block;margin:10px auto 0;">← Retour à l'accueil</button>
  </div>`;
  document.getElementById('backups-back-top').onclick = renderHome;
  document.getElementById('backups-back-bottom').onclick = renderHome;
  document.getElementById('backup-now-btn').onclick = async ()=>{
    const btn = document.getElementById('backup-now-btn');
    btn.disabled = true; btn.textContent = 'Sauvegarde en cours…';
    try{
      await createBackupSnapshot(RESTAURANT_ID);
    }catch(e){
      alert('Échec de la sauvegarde : '+(e.message||'réessaie'));
      if(typeof logAppError==='function') logAppError({message:'Échec sauvegarde manuelle : '+e.message, stack: e.stack});
    }
    renderBackups();
  };
  root.querySelectorAll('[data-delbackup]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm(`Supprimer la sauvegarde du ${btn.dataset.delbackup} ?`)) return;
      await deleteBackupSnapshot(RESTAURANT_ID, btn.dataset.delbackup);
      renderBackups();
    };
  });
  root.querySelectorAll('[data-restore]').forEach(btn=>{
    btn.onclick = async ()=>{
      const stamp = btn.dataset.restore;
      if(!confirm(`Restaurer la sauvegarde du ${stamp} ? Toutes les données actuelles de l'établissement seront remplacées par celles de cette date. Cette action est irréversible.`)) return;
      btn.disabled = true; btn.textContent = 'Restauration…';
      try{
        await restoreBackupSnapshot(RESTAURANT_ID, stamp);
        alert('Sauvegarde restaurée ✓');
        renderHome();
      }catch(e){
        alert('Erreur pendant la restauration : '+(e.message||'réessaie'));
        if(typeof logAppError==='function') logAppError({message:'Échec restauration sauvegarde : '+e.message, stack: e.stack});
        renderBackups();
      }
    };
  });
}

  };
