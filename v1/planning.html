<script>
// ---------- helpers propres à cette page ----------
function pad2(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtISODate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDateFR(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'2-digit'}); }
function fmtDateShort(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function monthKeyOf(iso){ return iso.slice(0,7); }
function startOfWeek(d){
  const date = new Date(d); date.setHours(0,0,0,0);
  const day = date.getDay();
  const diff = (day===0 ? -6 : 1-day);
  date.setDate(date.getDate()+diff);
  return date;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

const ICONS = {
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-linecap="round"/>',
  user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3.5-6 7-6s7 2.5 7 6" stroke-linecap="round"/>',
  plus:'<path d="M12 5v14M5 12h14" stroke-linecap="round"/>',
  close:'<path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/>',
  chevronL:'<path d="M15 5 8 12l7 7" stroke-linecap="round" stroke-linejoin="round"/>',
  chevronR:'<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>',
  download:'<path d="M12 3v12m0 0-4-4m4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17" stroke-linecap="round"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke-linecap="round" stroke-linejoin="round"/>',
  layers:'<path d="M12 3 3 8l9 5 9-5-9-5Z" stroke-linejoin="round"/><path d="M3 12l9 5 9-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16l9 5 9-5" stroke-linecap="round" stroke-linejoin="round"/>',
  paste:'<rect x="7" y="6" width="10" height="14" rx="2"/><path d="M10 6V4.5A1.5 1.5 0 0 1 11.5 3h1A1.5 1.5 0 0 1 14 4.5V6" stroke-linecap="round"/>',
};
function icon(name, size){ return `<svg viewBox="0 0 24 24" width="${size||20}" height="${size||20}" fill="none" stroke="currentColor" stroke-width="1.8">${ICONS[name]}</svg>`; }

const STAFF_COLORS = ['#8B5E3C','#3E7C6B','#B2542B','#5C6FA6','#A64B7A','#6B8E23','#B23B3B','#4A7A96','#8A6D3B','#6B4A96'];
function staffColor(name){
  let h = 0;
  for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return STAFF_COLORS[h % STAFF_COLORS.length];
}

// ---------- auth ----------
const REQUIRED_PERM = 'planning';
const MODULE_TITLE = "Planning d'équipe";
async function onIdentityGranted(){
  try{
    await loadAll();
    render();
  }catch(e){

    document.getElementById('root').innerHTML = `

        <button class="primary" onclick="location.reload()" style="margin-top:10px;">Réessayer</button>
      </div>`;
  }
}
function logout(){
  performLogout();
  state.sheet = null;
  renderLoginScreen();
}

// ---------- state ----------
const state = {
  weekStart: startOfWeek(new Date()),
  staffList: [],
  teamFull: [],
  shifts: [],       // shifts for the currently loaded weeks' months
  incidents: [],    // renvois/incidents signés (peu nombreux : chargés une fois pour toute la session)
  absences: [],     // absences justifiées (idem)
  staffFilter: 'all',
  sheet: null,
  toast: null,
  loaded: false,
  clipboard: (function(){ try{ return JSON.parse(localStorage.getItem('ctr_shiftClipboard') || 'null'); }catch(e){ return null; } })(), // {staff, start, end, space, note}
};

async function loadAll(){
  const team = (await getData(`config:${RESTAURANT_ID}:team`, true, [])).map(normalizeMember);
  state.teamFull = team;
  state.staffList = team.map(m=>m.name);
  state.incidents = await getData(`config:${RESTAURANT_ID}:incidents`, true, []);
  state.absences = await getData(`config:${RESTAURANT_ID}:absences`, true, []);
  state.publishRecord = await getData(`config:${RESTAURANT_ID}:planningPublish`, true, {});
  await loadShiftsForWeek();
  state.loaded = true;
}
async function loadShiftsForWeek(){
  const days = weekDays(state.weekStart);
  const months = [...new Set(days.map(d=>monthKeyOf(fmtISODate(d))))];
  const arrays = await Promise.all(months.map(m=>getData(`log:${RESTAURANT_ID}:planning:${m}`, true, [])));
  state.shifts = arrays.flat();
}
function weekDays(weekStart){
  const days = [];
  for(let i=0;i<7;i++){ const d = new Date(weekStart); d.setDate(d.getDate()+i); days.push(d); }
  return days;
}

/* ---------- publication du planning ----------
   Un employé ne voit (dans "Mon planning", côté index.html) que les semaines explicitement publiées.
   Le statut "à jour / modifié" se calcule en comparant l'état actuel des créneaux de la semaine à
   l'instantané enregistré lors de la dernière publication — pas besoin de suivre un "updatedAt" sur
   chaque créneau, la comparaison se refait à chaque affichage. */
function weekShiftsSnapshot(weekStartIso, allShiftsForWeek){
  const byEmployee = {};
  allShiftsForWeek.forEach(s=>{ (byEmployee[s.staff] = byEmployee[s.staff] || []).push(`${s.date}|${s.start||''}|${s.end||''}|${s.note||''}`); });
  Object.keys(byEmployee).forEach(k=>byEmployee[k].sort());
  return byEmployee;
}
function weekPublishStatus(weekStartIso){
  const days = weekDays(new Date(weekStartIso+'T00:00:00')).map(fmtISODate);
  const weekShifts = state.shifts.filter(s=>days.includes(s.date));
  const current = weekShiftsSnapshot(weekStartIso, weekShifts);
  const rec = state.publishRecord[weekStartIso];
  if(!rec) return {published:false, upToDate:false};
  const changed = JSON.stringify(current) !== JSON.stringify(rec.snapshot);
  return {published:true, upToDate:!changed, publishedAt:rec.publishedAt, publishedBy:rec.publishedBy};
}
async function publishCurrentWeek(){
  const weekStartIso = fmtISODate(state.weekStart);
  const days = weekDays(state.weekStart).map(fmtISODate);
  const weekShifts = state.shifts.filter(s=>days.includes(s.date));
  const current = weekShiftsSnapshot(weekStartIso, weekShifts);
  const prevRec = state.publishRecord[weekStartIso];
  const prevSnapshot = prevRec ? prevRec.snapshot : {};

  // détermine qui est concerné par un changement depuis la dernière publication (ajout, modif ou suppression de créneau)
  const affected = new Set();
  new Set([...Object.keys(current), ...Object.keys(prevSnapshot)]).forEach(name=>{
    if(JSON.stringify(current[name]||[]) !== JSON.stringify(prevSnapshot[name]||[])) affected.add(name);
  });

  state.publishRecord[weekStartIso] = { publishedAt: new Date().toISOString(), publishedBy: CURRENT_USER_NAME||'Responsable', snapshot: current };
  await setData(`config:${RESTAURANT_ID}:planningPublish`, state.publishRecord, true);

  if(affected.size){
    const notices = await getData(`config:${RESTAURANT_ID}:planningNotices`, true, []);
    affected.forEach(name=>{
      notices.push({ id: uid(), employeeName: name, weekStart: weekStartIso, createdAt: new Date().toISOString(), seenAt: null });
    });
    await setData(`config:${RESTAURANT_ID}:planningNotices`, notices, true);
  }
  return affected.size;
}

/* ===================== modèle de planning (génération automatique) ===================== */
const TEMPLATE_SPACES = [['cuisine','Cuisine'],['salle','Salle'],['bar','Bar']];
const TEMPLATE_PERIODS = [['matin',"Avant service du matin"],['midi',"Après le service du midi"],['soir',"Avant fermeture"]];
const WEEKDAY_LABELS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const WEEKDAY_SHORT = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function defaultDayTemplate(){
  return {
    closed: false,
    cuisine: { matin:{start:'08:00', end:'11:30', count:2}, midi:{start:'11:30', end:'16:00', count:3}, soir:{start:'16:00', end:'23:00', count:2} },
    salle:   { matin:{start:'09:00', end:'12:00', count:1}, midi:{start:'12:00', end:'16:00', count:3}, soir:{start:'18:00', end:'23:30', count:3} },
    bar:     { matin:{start:'10:00', end:'12:00', count:1}, midi:{start:'12:00', end:'17:00', count:2}, soir:{start:'17:00', end:'23:59', count:2} },
  };
}
function defaultTemplate(){
  const tpl = {};
  for(let i=0;i<7;i++) tpl[i] = defaultDayTemplate();
  return tpl;
}
function mondayIndex(date){ const d = date.getDay(); return d===0 ? 6 : d-1; } // JS: 0=dim..6=sam → 0=lun..6=dim

// Calcule, pour chaque employé, un binôme de 2 jours de repos consécutifs, en tournant
// entre deux groupes autour du jour de fermeture (ou, en semaine 7j/7, en priorisant
// lundi/mardi/mercredi plutôt que jeu-ven-sam-dim).
function computeRestDayAssignments(tpl, days, team){
  const closedIdx = [];
  for(let i=0;i<7;i++){ if(tpl[i] && tpl[i].closed) closedIdx.push(i); }

  let pairA = null, pairB = null;
  if(closedIdx.length === 1){
    const c = closedIdx[0];
    pairA = [(c+6)%7, c];       // veille + jour de fermeture
    pairB = [c, (c+1)%7];       // jour de fermeture + lendemain
  } else if(closedIdx.length === 0){
    pairA = [0,1]; // lundi-mardi
    pairB = [1,2]; // mardi-mercredi
  }
  // 2+ jours de fermeture : pas de règle spécifique, on laisse le repos hebdo simple gérer ça.

  const restDays = {};
  const weekAnchor = Math.floor(days[0].getTime()/86400000);
  const weekParity = Math.floor(weekAnchor/7) % 2;
  const eligibleTeam = team.filter(m=>m.postes && m.postes.length);
  eligibleTeam.forEach((m,idx)=>{
    if(!pairA){ restDays[m.name] = new Set(); return; }
    const useA = (idx + weekParity) % 2 === 0;
    restDays[m.name] = new Set(useA ? pairA : pairB);
  });
  return restDays;
}

function generateWeekShifts(tpl, days, team){
  const LEGAL_LIMITS = {
    maxDailyMin: 10*60,   // 10h/jour (Code du travail, limite générale)
    maxWeeklyMin: 48*60,  // 48h/semaine (limite absolue)
    minRestMin: 11*60,    // 11h de repos entre deux jours travaillés
    maxDaysBeforeRest: 6, // repos hebdomadaire obligatoire
  };
  const spaceLabel = {cuisine:'Cuisine', salle:'Salle', bar:'Bar'};
  const eligibleBySpace = {
    cuisine: team.filter(m=>m.postes.includes('cuisine')),
    salle:   team.filter(m=>m.postes.includes('salle')),
    bar:     team.filter(m=>m.postes.includes('bar')),
  };
  function minutesOf(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }
  function durationMin(start,end){ let d = minutesOf(end)-minutesOf(start); if(d<=0) d += 24*60; return d; }

  const weeklyMin = {}; const dailyMin = {}; const daysWorked = {}; const lastEnd = {}; const dayIntervals = {};
  team.forEach(m=>{ weeklyMin[m.name]=0; dailyMin[m.name]={}; daysWorked[m.name]=new Set(); lastEnd[m.name]=null; dayIntervals[m.name]={}; });
  const restDays = computeRestDayAssignments(tpl, days, team);

  const newShifts = [];
  const warnings = [];

  days.forEach(dateObj=>{
    const dateIso = fmtISODate(dateObj);
    const wIdx = mondayIndex(dateObj);
    const dayTpl = tpl[wIdx] || defaultDayTemplate();
    if(dayTpl.closed) return; // établissement fermé ce jour-là : aucun créneau généré
    const periodQualified = {}; // suivi : une personne "Ouverture/Fermeture+Caisse" est-elle déjà prévue ce moment-là ?

    TEMPLATE_PERIODS.forEach(([pKey,pLabel])=>{
      const needsQualif = (pKey==='matin' || pKey==='soir');
      TEMPLATE_SPACES.forEach(([spKey])=>{
        const conf = dayTpl[spKey] && dayTpl[spKey][pKey];
        if(!conf || !conf.count) return;
        const pool = eligibleBySpace[spKey];
        if(!pool.length){
          warnings.push(`${spaceLabel[spKey]} — ${pLabel} le ${dateIso} : personne n'a le poste "${spaceLabel[spKey]}"`);
          return;
        }
        const dur = durationMin(conf.start, conf.end);
        const startDT = new Date(dateIso+'T'+conf.start+':00');
        let endDT = new Date(dateIso+'T'+conf.end+':00');
        if(endDT <= startDT) endDT = new Date(endDT.getTime()+24*3600000);

        const usedThisSlot = new Set(); // empêche d'assigner 2x la même personne sur ce créneau exact
        for(let i=0;i<conf.count;i++){
          let candidates = pool.slice();
          let flagRestDay=false, flagRest=false, flagWeekly=false;

          // --- règles STRICTES : jamais contournées, quitte à laisser le créneau vacant ---
          candidates = candidates.filter(m=> !usedThisSlot.has(m.name));
          if(candidates.length===0){
            warnings.push(`${spaceLabel[spKey]} — ${pLabel} le ${dateIso} : ${conf.count} personne(s) demandée(s) mais seulement ${usedThisSlot.size} disponible(s) au poste "${spaceLabel[spKey]}"`);
            break;
          }
          candidates = candidates.filter(m=>{
            const ivs = dayIntervals[m.name][dateIso] || [];
            return !ivs.some(iv => startDT < iv.end && endDT > iv.start); // pas de chevauchement, même sur un autre espace
          });
          if(candidates.length===0){
            warnings.push(`${spaceLabel[spKey]} — ${pLabel} le ${dateIso} : personne de libre à cet horaire (tout le monde est déjà occupé sur ce créneau ailleurs)`);
            continue;
          }
          candidates = candidates.filter(m=> (dailyMin[m.name][dateIso]||0)+dur <= LEGAL_LIMITS.maxDailyMin );
          if(candidates.length===0){
            warnings.push(`${spaceLabel[spKey]} — ${pLabel} le ${dateIso} : personne ne peut prendre ce créneau sans dépasser 10h ce jour-là (créneau non pourvu)`);
            continue;
          }

          // --- règles souples : priorisées, mais contournées avec alerte si vraiment aucune alternative ---
          let step = candidates.filter(m=> !restDays[m.name] || !restDays[m.name].has(wIdx) );
          if(step.length===0) flagRestDay=true; else candidates=step;

          step = candidates.filter(m=> !lastEnd[m.name] || (startDT-lastEnd[m.name]) >= LEGAL_LIMITS.minRestMin*60000 );
          if(step.length===0) flagRest=true; else candidates=step;

          step = candidates.filter(m=> weeklyMin[m.name]+dur <= LEGAL_LIMITS.maxWeeklyMin );
          if(step.length===0) flagWeekly=true; else candidates=step;

          step = candidates.filter(m=> daysWorked[m.name].size < LEGAL_LIMITS.maxDaysBeforeRest || daysWorked[m.name].has(dateIso) );
          if(step.length>0) candidates=step;

          const periodKey = dateIso+'|'+pKey;
          candidates.sort((a,b)=>{
            if(needsQualif && !periodQualified[periodKey]){
              const aQ = (a.postes||[]).includes('ouvfer') ? 0 : 1;
              const bQ = (b.postes||[]).includes('ouvfer') ? 0 : 1;
              if(aQ!==bQ) return aQ-bQ;
            }
            const targetA = (a.weeklyHours||35)*60, targetB = (b.weeklyHours||35)*60;
            return (weeklyMin[a.name]/targetA) - (weeklyMin[b.name]/targetB);
          });
          const chosen = candidates[0];
          if(!chosen){
            warnings.push(`${spaceLabel[spKey]} — ${pLabel} le ${dateIso} : aucune personne disponible dans le respect des limites (repos/heures)`);
            continue;
          }
          usedThisSlot.add(chosen.name);
          if(needsQualif && (chosen.postes||[]).includes('ouvfer')) periodQualified[periodKey] = true;

          newShifts.push({id:uid('r'), staff:chosen.name, date:dateIso, start:conf.start, end:conf.end, space:spaceLabel[spKey], note:'Généré automatiquement'});
          weeklyMin[chosen.name] += dur;
          dailyMin[chosen.name][dateIso] = (dailyMin[chosen.name][dateIso]||0) + dur;
          daysWorked[chosen.name].add(dateIso);
          lastEnd[chosen.name] = endDT;
          (dayIntervals[chosen.name][dateIso] = dayIntervals[chosen.name][dateIso] || []).push({start:startDT, end:endDT});

          if(flagRestDay) warnings.push(`${chosen.name} : travaille sur un jour prévu comme repos consécutif (${dateIso}) — organisation à vérifier`);
          if(flagRest) warnings.push(`${chosen.name} : moins de 11h de repos avant ce créneau (${dateIso})`);
          if(flagWeekly) warnings.push(`${chosen.name} : dépasserait 48h sur la semaine`);
          if(daysWorked[chosen.name].size > LEGAL_LIMITS.maxDaysBeforeRest) warnings.push(`${chosen.name} : travaille les 7 jours de la semaine, aucun repos hebdomadaire`);
        }
      });
      if(needsQualif && !periodQualified[dateIso+'|'+pKey]){
        const hadAnyShift = newShifts.some(s=>s.date===dateIso);
        if(hadAnyShift) warnings.push(`${dateIso} — ${pLabel} : personne avec le poste "Ouverture/Fermeture + Caisse" n'est prévu(e), pense à vérifier qui ouvre/ferme et fait la caisse.`);
      }
    });
  });

  team.forEach(m=>{
    if(m.weeklyHours){
      const assignedH = weeklyMin[m.name]/60;
      if(assignedH > m.weeklyHours*1.1){
        warnings.push(`${m.name} : ${assignedH.toFixed(1)}h planifiées pour un contrat de ${m.weeklyHours}h — vérifier les heures supplémentaires`);
      } else if(assignedH < m.weeklyHours*0.7 && assignedH>0){
        warnings.push(`${m.name} : seulement ${assignedH.toFixed(1)}h planifiées pour un contrat de ${m.weeklyHours}h`);
      }
    }
  });

  return {newShifts, warnings};
}
async function saveGeneratedShifts(newShifts){
  const byMonth = {};
  newShifts.forEach(s=>{
    const mk = monthKeyOf(s.date);
    (byMonth[mk] = byMonth[mk] || []).push(s);
  });
  for(const mk of Object.keys(byMonth)){
    const existing = await getData(`log:${RESTAURANT_ID}:planning:${mk}`, true, []);
    await setData(`log:${RESTAURANT_ID}:planning:${mk}`, existing.concat(byMonth[mk]), true);
  }
}

function render(){

    renderInner();
  }catch(e){
    console.error('render error', e);
    document.getElementById('root').innerHTML = `

        <h2 style="margin-top:0;color:#B23B3B;">Erreur d'affichage</h2>

        <pre style="white-space:pre-wrap;font-size:11px;background:var(--sand);padding:10px;border-radius:8px;">${(e && e.stack || e || '').toString().replace(/</g,'&lt;')}</pre>
        <button class="primary" onclick="location.reload()" style="margin-top:10px;">Réessayer</button>
      </div>`;
  }
}
function renderInner(){
  const root = document.getElementById('root');
  if(!state.loaded){ root.innerHTML = `<div class="loading">Chargement…</div>`; return; }
  root.innerHTML = `
    ${Header()}
    <main>${MainContent()}</main>
    ${state.sheet ? Sheet() : ''}
    ${state.toast ? `<div class="toast">${state.toast}</div>` : ''}
  `;
  attachHandlers();
  syncBodyScrollLock();
}
/* ---------- verrouillage du défilement de fond pendant qu'une fenêtre (sheet) est ouverte ----------
   Sans ça, un glissement du doigt sur la fenêtre peut faire défiler l'écran EN DESSOUS plutôt que
   la fenêtre elle-même — la technique position:fixed est celle qui fonctionne de façon fiable sur
   iOS Safari (un simple overflow:hidden sur body ne suffit pas toujours). */
function syncBodyScrollLock(){
  if(state.sheet){
    if(!document.body.dataset.scrollLocked){
      const y = window.scrollY || window.pageYOffset || 0;
      document.body.dataset.scrollLocked = String(y);
      document.body.style.position = 'fixed';
      document.body.style.top = `-${y}px`;
      document.body.style.width = '100%';
    }
  } else if(document.body.dataset.scrollLocked){
    const y = parseInt(document.body.dataset.scrollLocked, 10) || 0;
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.width = '';
    delete document.body.dataset.scrollLocked;
    window.scrollTo(0, y);
  }
}

          const restNames = restCandidates.filter(m=>!workingNames.has(m.name)).map(m=>m.name);

            ${restNames.map(n=>`<div class="rest-name-row" data-action="add-shift-for" data-date="${iso}" data-staff="${escapeHtml(n)}" style="cursor:pointer;">${escapeHtml(n)}<span class="rest-tag">Repos</span></div>`).join('')}
          </div>`;

  </section>

  const shift = state.shifts.find(x=>x.id===s.shiftId);
  if(!shift) return '';
  const days = weekDays(state.weekStart);
  return `

  <p style="font-size:13px;margin-bottom:10px;">Sur quels autres jours de cette semaine appliquer le même créneau ?</p>
  <div style="display:flex;flex-direction:column;gap:2px;margin-bottom:16px;">
    ${days.map(d=>{
      const iso = fmtISODate(d);
      const isSource = iso===shift.date;
      return `<label style="display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);${isSource?'opacity:.4;':''}">
        <input type="checkbox" class="dup-day-check" value="${iso}" style="width:17px;flex-shrink:0;" ${isSource?'disabled':''}>
        ${d.toLocaleDateString('fr-FR',{weekday:'long', day:'2-digit', month:'2-digit'})}${isSource?' (jour d\'origine)':''}
      </label>`;
    }).join('')}
  </div>
  <button class="primary" data-action="duplicate-days-confirm">Dupliquer</button>
  `;
}

function captureCurrentTemplateDay(){
  const closedEl = document.getElementById('tpl-closed');
  if(!closedEl) return;
  const dayIdx = state.templateDay || 0;
  const dayTpl = {closed: closedEl.checked};
  TEMPLATE_SPACES.forEach(([spKey])=>{
    dayTpl[spKey] = {};
    TEMPLATE_PERIODS.forEach(([pKey])=>{
      const startEl = document.querySelector(`.tpl-start[data-space="${spKey}"][data-period="${pKey}"]`);
      const endEl = document.querySelector(`.tpl-end[data-space="${spKey}"][data-period="${pKey}"]`);
      const countEl = document.querySelector(`.tpl-count[data-space="${spKey}"][data-period="${pKey}"]`);
      dayTpl[spKey][pKey] = {
        start: startEl ? startEl.value : '09:00',
        end: endEl ? endEl.value : '17:00',
        count: countEl ? Math.max(0, parseInt(countEl.value||'0',10)) : 0,
      };
    });
  });
  state.template[dayIdx] = dayTpl;
}

function TemplateForm(){
  if(!state.template) state.template = defaultTemplate();
  const t = state.template;
  const dayIdx = state.templateDay || 0;
  const dayTpl = t[dayIdx] || defaultDayTemplate();

  const dayTabs = WEEKDAY_SHORT.map((label,i)=>`
    <button type="button" class="tpl-day-tab ${i===dayIdx?'active':''} ${t[i] && t[i].closed?'closed':''}" data-action="tpl-day" data-day="${i}">${label}</button>
  `).join('');

  let rows = '';
  TEMPLATE_SPACES.forEach(([spKey, spLabel])=>{
    rows += `<div style="font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--sea);margin:14px 0 6px;">${spLabel}</div>`;
    TEMPLATE_PERIODS.forEach(([pKey, pLabel])=>{
      const conf = (dayTpl[spKey] && dayTpl[spKey][pKey]) || {start:'09:00', end:'17:00', count:1};
      rows += `
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
        <span style="flex:1;font-size:11.5px;color:var(--ink-soft);">${pLabel}</span>
        <input type="time" class="tpl-start" data-space="${spKey}" data-period="${pKey}" value="${conf.start}" style="width:92px;padding:8px;">
        <input type="time" class="tpl-end" data-space="${spKey}" data-period="${pKey}" value="${conf.end}" style="width:92px;padding:8px;">
        <input type="number" min="0" class="tpl-count" data-space="${spKey}" data-period="${pKey}" value="${conf.count}" style="width:50px;padding:8px;">
      </div>`;
    });
  });

  return `
  <h3 class="sheet-title">Planning type de la semaine</h3>
  <p style="font-size:12.5px;color:var(--ink-soft);margin:-8px 0 12px;">Règle chaque jour indépendamment : jours de fermeture et horaires propres à chaque jour. L'équipe disponible (selon son poste de travail) sera répartie en priorisant ceux en dessous de leurs heures de contrat, avec alertes si les limites légales générales (10h/jour, 48h/semaine, 11h de repos, repos hebdomadaire) ne sont pas respectées. L'équipe est aussi répartie en deux groupes qui tournent sur <strong>2 jours de repos consécutifs</strong> : autour du jour de fermeture s'il y en a un, sinon en priorité sur lundi-mardi ou mardi-mercredi (jamais jeudi-dimanche). Le matin et le soir, une personne ayant le poste <strong>"Ouverture/Fermeture + Caisse"</strong> est priorisée ; sinon une alerte te le signale.</p>
  <p style="font-size:11px;color:var(--alert);margin:0 0 14px;">⚠️ Garde-fous généraux uniquement — ne remplace pas une vérification avec un expert social CHR (coupures, majorations, temps partiel...).</p>

  <div class="tpl-day-tabs">${dayTabs}</div>

  <label style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:14px 0;padding:10px 12px;background:var(--sand-dark);border-radius:10px;">
    <input type="checkbox" id="tpl-closed" ${dayTpl.closed?'checked':''}> Fermé le ${WEEKDAY_LABELS[dayIdx].toLowerCase()} — aucun créneau ne sera généré ce jour-là
  </label>

  <div id="tpl-day-grid" style="${dayTpl.closed?'display:none;':''}">
    <div style="display:flex;gap:6px;font-size:10.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;">
      <span style="flex:1;"></span><span style="width:92px;">Début</span><span style="width:92px;">Fin</span><span style="width:50px;">Nb</span>
    </div>
    ${rows}
  </div>

  <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin:16px 0;">
    <input type="checkbox" id="tpl-replace"> Remplacer les créneaux déjà existants cette semaine
  </label>
  <button class="primary" data-action="generate-template" style="margin-bottom:8px;">🪄 Générer le planning de la semaine</button>
  <button class="secondary" data-action="close-sheet">Fermer</button>
  `;
}

function ShiftForm(s){
  const editing = !!s.id;
  const existing = editing ? state.shifts.find(x=>x.id===s.id) : null;
  const preselectedStaff = existing ? existing.staff : (s.staff || (state.staffList[0]||''));
  let suggestedSpace = existing ? existing.space : '';
  if(!existing && preselectedStaff){
    const member = state.teamFull.find(m=>m.name===preselectedStaff);
    if(member){
      const order = [['cuisine','Cuisine'],['salle','Salle'],['bar','Bar']];
      const match = order.find(([poste])=>member.postes.includes(poste));
      if(match) suggestedSpace = match[1];
    }
  }
  return `
  <h3 class="sheet-title">${editing ? 'Modifier le créneau' : 'Ajouter un créneau'}</h3>
  <div class="field">
    <label class="field-label">Personne</label>
    <select id="shift-staff">
      ${state.staffList.map(n=>`<option value="${escapeHtml(n)}" ${preselectedStaff===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
    </select>
    ${!state.staffList.length ? `<p style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Aucune personne enregistrée — ajoute-la d'abord via "Gérer l'équipe".</p>` : ''}
  </div>
  <div class="field"><label class="field-label">Date</label><input id="shift-date" type="date" value="${existing?existing.date:s.date}"></div>
  <div class="grid2">
    <div class="field"><label class="field-label">Début</label><input id="shift-start" type="time" value="${existing?existing.start:'09:00'}"></div>
    <div class="field"><label class="field-label">Fin</label><input id="shift-end" type="time" value="${existing?existing.end:'17:00'}"></div>
  </div>
  <div class="field">
    <label class="field-label">Espace <span style="font-weight:400;text-transform:none;">(suggéré selon les accès de la personne)</span></label>
    <select id="shift-space">
      <option value="" ${!suggestedSpace?'selected':''}>—</option>
      <option value="Cuisine" ${suggestedSpace==='Cuisine'?'selected':''}>Cuisine</option>
      <option value="Salle" ${suggestedSpace==='Salle'?'selected':''}>Salle</option>
      <option value="Bar" ${suggestedSpace==='Bar'?'selected':''}>Bar</option>
    </select>
  </div>
  <div class="field"><label class="field-label">Note (optionnel)</label><input id="shift-note" value="${escapeHtml(existing?existing.note||'':'')}" placeholder="ex : formation, remplacement…"></div>
  <button class="primary" data-action="save-shift" data-id="${editing?s.id:''}">${editing?'Enregistrer':'Ajouter le créneau'}</button>
  `;
}

// ---------- events ----------
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click', onAction));
  const backdrop = document.querySelector('.sheet-backdrop');
  if(backdrop){ backdrop.querySelector('[data-stop]').addEventListener('click', e=>e.stopPropagation()); }
  const filterSel = document.getElementById('staff-filter');
  if(filterSel){ filterSel.addEventListener('change', ()=>{ state.staffFilter = filterSel.value; render(); }); }
  const nav = document.getElementById('page-nav-select');
  if(nav){ nav.addEventListener('change', ()=>{ if(nav.value) window.location.href = nav.value; }); }
  const weekJumpLabel = document.getElementById('weekJumpLabel');
  const weekJumpInput = document.getElementById('weekJumpInput');
  if(weekJumpLabel && weekJumpInput){
    weekJumpLabel.addEventListener('click', ()=>{
      if(weekJumpInput.showPicker){ weekJumpInput.showPicker(); } else { weekJumpInput.click(); weekJumpInput.focus(); }
    });
    weekJumpInput.addEventListener('change', async ()=>{
      if(!weekJumpInput.value) return;
      state.weekStart = startOfWeek(new Date(weekJumpInput.value+'T00:00:00'));
      await loadShiftsForWeek(); render();
    });
  }
  const staffSel = document.getElementById('shift-staff');
  const spaceSel = document.getElementById('shift-space');
  if(staffSel && spaceSel){
    staffSel.addEventListener('change', ()=>{
      const member = state.teamFull.find(m=>m.name===staffSel.value);
      if(!member) return;
      const order = [['cuisine','Cuisine'],['salle','Salle'],['bar','Bar']];
      const match = order.find(([poste])=>member.postes.includes(poste));
      if(match) spaceSel.value = match[1];
    });
  }
  const closedEl = document.getElementById('tpl-closed');
  const gridEl = document.getElementById('tpl-day-grid');
  if(closedEl && gridEl){
    closedEl.addEventListener('change', ()=>{ gridEl.style.display = closedEl.checked ? 'none' : ''; });
  }
}

async function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;

  if(action==='copy-shift'){
    const s = state.shifts.find(x=>x.id===el.dataset.id);
    if(!s) return;
    state.clipboard = {staff:s.staff, start:s.start, end:s.end, space:s.space, note:s.note||''};
    try{ localStorage.setItem('ctr_shiftClipboard', JSON.stringify(state.clipboard)); }catch(e){}
    render();
    showToast(`Créneau de ${s.staff} copié — touche "Coller" sur un jour ✓`);
    return;
  }
  if(action==='clear-clipboard'){
    state.clipboard = null;
    try{ localStorage.removeItem('ctr_shiftClipboard'); }catch(e){}
    render(); return;
  }
  if(action==='paste-shift'){
    const date = el.dataset.date;
    if(!state.clipboard) return;
    const mk = monthKeyOf(date);
    const monthShifts = await getData(`log:${RESTAURANT_ID}:planning:${mk}`, true, []);
    monthShifts.push({id:uid(), staff:state.clipboard.staff, date, start:state.clipboard.start, end:state.clipboard.end, space:state.clipboard.space, note:state.clipboard.note});
    const saved = await setData(`log:${RESTAURANT_ID}:planning:${mk}`, monthShifts, true);
    if(!saved){ showToast('⚠️ '+(lastStorageError || 'Échec de sauvegarde')); return; }
    await loadShiftsForWeek(); render();
    showToast('Créneau collé ✓');
    return;
  }
  if(action==='duplicate-shift-days'){
    const s = state.shifts.find(x=>x.id===el.dataset.id);
    if(!s) return;
    state.sheet = {type:'duplicate-days', shiftId: s.id};
    render(); return;
  }
  if(action==='duplicate-days-confirm'){
    const s = state.shifts.find(x=>x.id===state.sheet.shiftId);
    if(!s){ state.sheet=null; render(); return; }
    const checked = Array.from(document.querySelectorAll('.dup-day-check:checked')).map(c=>c.value);
    if(!checked.length){ showToast('Choisis au moins un jour.'); return; }
    const byMonth = {};
    checked.forEach(date=>{ (byMonth[monthKeyOf(date)] = byMonth[monthKeyOf(date)] || []).push(date); });
    for(const mk of Object.keys(byMonth)){
      const monthShifts = await getData(`log:${RESTAURANT_ID}:planning:${mk}`, true, []);
      byMonth[mk].forEach(date=>{
        monthShifts.push({id:uid(), staff:s.staff, date, start:s.start, end:s.end, space:s.space, note:s.note||''});
      });
      const saved = await setData(`log:${RESTAURANT_ID}:planning:${mk}`, monthShifts, true);
      if(!saved){ showToast('⚠️ '+(lastStorageError || 'Échec de sauvegarde')); return; }
    }
    await loadShiftsForWeek();
    state.sheet = null; render();
    showToast(`Créneau dupliqué sur ${checked.length} jour${checked.length>1?'s':''} ✓`);
    return;
  }
  if(action==='duplicate-week'){
    const days = weekDays(state.weekStart);
    const nextWeekDays = days.map(d=>{ const nd = new Date(d); nd.setDate(nd.getDate()+7); return nd; });
    const sourceIsos = days.map(fmtISODate);
    const targetIsos = nextWeekDays.map(fmtISODate);
    const shiftsToCopy = state.shifts.filter(s=>sourceIsos.includes(s.date));
    if(!shiftsToCopy.length){ showToast('Aucun créneau à dupliquer cette semaine.'); return; }
    if(!confirm(`Dupliquer les ${shiftsToCopy.length} créneau(x) de cette semaine vers la semaine suivante ?`)) return;
    const byMonth = {};
    shiftsToCopy.forEach(s=>{
      const idx = sourceIsos.indexOf(s.date);
      const targetDate = targetIsos[idx];
      const mk = monthKeyOf(targetDate);
      (byMonth[mk] = byMonth[mk] || []).push({id:uid(), staff:s.staff, date:targetDate, start:s.start, end:s.end, space:s.space, note:s.note||''});
    });
    for(const mk of Object.keys(byMonth)){
      const monthShifts = await getData(`log:${RESTAURANT_ID}:planning:${mk}`, true, []);
      const saved = await setData(`log:${RESTAURANT_ID}:planning:${mk}`, [...monthShifts, ...byMonth[mk]], true);
      if(!saved){ showToast('⚠️ '+(lastStorageError || 'Échec de sauvegarde')); return; }
    }
    showToast(`${shiftsToCopy.length} créneau(x) dupliqué(s) sur la semaine suivante ✓`);
    return;
  }

  if(action==='logout'){ logout(); return; }
  if(action==='switch-person'){ switchPerson(); return; }
  if(action==='close-sheet'){ state.sheet = null; render(); return; }

  if(action==='week-prev'){
    const d = new Date(state.weekStart); d.setDate(d.getDate()-7); state.weekStart = d;
    await loadShiftsForWeek(); render(); return;
  }
  if(action==='week-next'){
    const d = new Date(state.weekStart); d.setDate(d.getDate()+7); state.weekStart = d;
    await loadShiftsForWeek(); render(); return;
  }
  if(action==='publish-week'){
    const n = await publishCurrentWeek();
    showToast(n ? `Semaine publiée — ${n} employé${n>1?'s':''} notifié${n>1?'s':''} ✓` : 'Semaine publiée ✓');
    render(); return;
  }

  if(action==='open-template'){
    state.template = (await getData(`config:${RESTAURANT_ID}:planning:template`, true, null)) || defaultTemplate();
    state.templateDay = 0;
    state.sheet = {type:'template'};
    render(); return;
  }
  if(action==='tpl-day'){
    captureCurrentTemplateDay();
    state.templateDay = parseInt(el.dataset.day, 10);
    render(); return;
  }
  if(action==='generate-template'){
    captureCurrentTemplateDay();
    const tpl = state.template;
    await setData(`config:${RESTAURANT_ID}:planning:template`, tpl, true);

    const days = weekDays(state.weekStart);
    const replace = document.getElementById('tpl-replace').checked;
    if(replace){
      const dayIsos = days.map(d=>fmtISODate(d));
      const months = [...new Set(dayIsos.map(monthKeyOf))];
      for(const mk of months){
        const arr = await getData(`log:${RESTAURANT_ID}:planning:${mk}`, true, []);
        await setData(`log:${RESTAURANT_ID}:planning:${mk}`, arr.filter(s=>!dayIsos.includes(s.date)), true);
      }
    }
    const {newShifts, warnings} = generateWeekShifts(tpl, days, state.teamFull);
    await saveGeneratedShifts(newShifts);
    await loadShiftsForWeek();
    state.sheet = null; render();
    showToast(`${newShifts.length} créneau(x) généré(s)${warnings.length ? ' — voir les alertes' : ' ✓'}`);
    if(warnings.length) setTimeout(()=>alert('⚠️ À vérifier :\n\n'+warnings.join('\n')), 300);
    return;
  }
  if(action==='add-shift'){ state.sheet = {type:'shift-form', date: el.dataset.date}; render(); return; }
  if(action==='add-shift-for'){ state.sheet = {type:'shift-form', date: el.dataset.date, staff: el.dataset.staff}; render(); return; }
  if(action==='edit-shift'){ state.sheet = {type:'shift-form', id: el.dataset.id, date: null}; render(); return; }
  if(action==='save-shift'){
    const id = el.dataset.id;
    const staff = document.getElementById('shift-staff').value;
    const date = document.getElementById('shift-date').value;
    const start = document.getElementById('shift-start').value;
    const end = document.getElementById('shift-end').value;
    const space = document.getElementById('shift-space').value;
    const note = document.getElementById('shift-note').value.trim();
    if(!staff){ showToast("Ajoute au moins une personne dans Gérer l'équipe"); return; }
    if(!date){ showToast('Choisis une date'); return; }
    const mk = monthKeyOf(date);
    const monthShifts = await getData(`log:${RESTAURANT_ID}:planning:${mk}`, true, []);
    let entry;
    if(id){
      entry = monthShifts.find(x=>x.id===id) || {id};
      Object.assign(entry, {staff, date, start, end, space, note});
      const idx = monthShifts.findIndex(x=>x.id===id);
      if(idx>=0) monthShifts[idx] = entry; else monthShifts.push(entry);
    } else {
      entry = {id:uid(), staff, date, start, end, space, note};
      monthShifts.push(entry);
    }
    const saved = await setData(`log:${RESTAURANT_ID}:planning:${mk}`, monthShifts, true);
    if(!saved){ showToast('⚠️ '+(lastStorageError || 'Échec de sauvegarde')); return; }
    await loadShiftsForWeek();
    state.sheet = null; render(); showToast('Créneau enregistré ✓');
    return;
  }
  if(action==='delete-shift'){
    const id = el.dataset.id;
    const s = state.shifts.find(x=>x.id===id);
    if(!s) return;
    const mk = monthKeyOf(s.date);
    const monthShifts = await getData(`log:${RESTAURANT_ID}:planning:${mk}`, true, []);
    const updated = monthShifts.filter(x=>x.id!==id);
    const saved = await setData(`log:${RESTAURANT_ID}:planning:${mk}`, updated, true);
    if(!saved){ showToast('⚠️ '+(lastStorageError || 'Échec de sauvegarde')); return; }
    await loadShiftsForWeek(); render();
    return;
  }

  if(action==='gcal-add'){
    const s = state.shifts.find(x=>x.id===el.dataset.id);
    if(!s) return;
    openGoogleCalendarQuickAdd(s);
    return;
  }
  if(action==='export-ics'){
    await exportICSForStaff(state.staffFilter);
    return;
  }
}

// ---------- Google Agenda ----------
function toGCalDateTime(date, time){
  return date.replace(/-/g,'') + 'T' + (time||'09:00').replace(':','') + '00';
}
function openGoogleCalendarQuickAdd(s){
  const title = encodeURIComponent(`Travail — ${RESTAURANT_NAME||''}${s.space?' ('+s.space+')':''}`);
  const dates = `${toGCalDateTime(s.date, s.start)}/${toGCalDateTime(s.date, s.end)}`;
  const details = encodeURIComponent(s.note || '');
  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}`;
  window.open(url, '_blank');
}

function icsEscape(s){ return (s||'').replace(/[\\,;]/g, m=>'\\'+m).replace(/\n/g,'\\n'); }
function toICSDateTime(date, time){
  return date.replace(/-/g,'') + 'T' + (time||'09:00').replace(':','') + '00';
}
async function exportICSForStaff(staffName){
  if(staffName==='all'){ showToast('Choisis une personne pour exporter son planning'); return; }
  const now = new Date();
  const months = [];
  for(let i=0;i<4;i++){
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    months.push(d.getFullYear()+'-'+pad2(d.getMonth()+1));
  }
  const arrays = await Promise.all(months.map(m=>getData(`log:${RESTAURANT_ID}:planning:${m}`, true, [])));
  const shifts = arrays.flat().filter(s=>s.staff===staffName);
  if(!shifts.length){ showToast('Aucun créneau à venir pour cette personne'); return; }
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//CheckTaCuisine//Planning//FR\r\nCALSCALE:GREGORIAN\r\n';
  shifts.forEach(s=>{
    ics += 'BEGIN:VEVENT\r\n';
    ics += `UID:${s.id}@checktacuisine\r\n`;
    ics += `DTSTAMP:${toICSDateTime(todayISO(),'00:00')}\r\n`;
    ics += `DTSTART:${toICSDateTime(s.date, s.start)}\r\n`;
    ics += `DTEND:${toICSDateTime(s.date, s.end)}\r\n`;
    ics += `SUMMARY:${icsEscape('Travail — '+(RESTAURANT_NAME||'')+(s.space?' ('+s.space+')':''))}\r\n`;
    if(s.note) ics += `DESCRIPTION:${icsEscape(s.note)}\r\n`;
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `planning-${slugify(staffName)}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Fichier téléchargé ✓');
}
